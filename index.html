<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صندوق العائلة</title>
<meta name="theme-color" content="#1C5A47" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="صندوق العائلة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a pocket ledger — one column, bottom tab bar, sheets that slide up for every entry */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --sunk:#E1E8E4; --line:#CFD9D4;
  --ink:#13201C; --muted:#56655F; --pine:#1C5A47; --pine-soft:#D5E6DE; --on-pine:#FFFFFF;
  --brass:#946C1E; --good:#1F7444; --bad:#AE3626; --warn:#9A620E; --warn-soft:#F6EBD6;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#eda100; --m5:#e87ba4; --cash:#eb6834;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2B3A35;
  --ink:#E4ECE8; --muted:#94A69F; --pine:#5DB393; --pine-soft:#1E3A31; --on-pine:#0B1311;
  --brass:#D7AE5E; --good:#5CC48A; --bad:#EE7A68; --warn:#E3A84A; --warn-soft:#3A2E17;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --cash:#d95926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2B3A35;
  --ink:#E4ECE8; --muted:#94A69F; --pine:#5DB393; --pine-soft:#1E3A31; --on-pine:#0B1311;
  --brass:#D7AE5E; --good:#5CC48A; --bad:#EE7A68; --warn:#E3A84A; --warn-soft:#3A2E17;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --cash:#d95926; color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0;margin:0;color:var(--ink)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.chip-link{font-size:13px;color:var(--pine);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:999px;background:var(--surface)}

h2.sec{font-family:var(--f-display);font-weight:500;font-size:17px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec .aside{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}

.ledger-head{background:var(--pine);color:var(--on-pine);border-radius:20px;padding:20px 18px 16px;display:grid;gap:14px}
.ledger-head .lbl{font-size:13px;opacity:.85}
.ledger-head .big{font-size:38px;font-weight:700;line-height:1.1}
.ledger-head .big .cur{font-size:16px;font-weight:500;opacity:.85;margin-inline-start:6px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid color-mix(in srgb,var(--on-pine) 25%,transparent);padding-top:12px}
.trio div{min-width:0}
.trio .v{font-weight:600;font-size:16px}
.trio .k{font-size:12px;opacity:.8}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stack{display:grid;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.meter>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--pine)}
.meter.warn>i{background:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

.shares{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.shares span{display:block;height:100%}
.member{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%}
.member .nm{font-weight:600}
.member .sub{font-size:12px;color:var(--muted)}
.member .bal{text-align:end}
.member .bal b{font-size:16px}

.callout{border-radius:var(--r);padding:14px 16px;background:var(--warn-soft);color:var(--ink);display:grid;gap:10px}
.callout.ok{background:var(--pine-soft)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check .eq{font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.good{background:var(--pine-soft);color:var(--good)}
.badge.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--pine);color:var(--on-pine);min-height:46px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:none;border-inline:0;border-top:0}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .d{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.item .a{font-weight:700;text-align:end;align-self:center;grid-row:span 2}
.plus{color:var(--good)} .minus{color:var(--bad)}
.item .prog{grid-column:1/-1;margin-top:6px}
.item.closed{opacity:.6}
.clip{display:inline-block;margin-inline-start:6px;font-size:11px;color:var(--brass);font-weight:600}
.group-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:14px 4px 6px}

.empty{text-align:center;padding:28px 18px;display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{margin:0;color:var(--muted);max-width:34ch}

nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted);min-height:56px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pine);font-weight:600}
.tab.add{justify-self:center;width:100%}
.tab.add span.fab{width:46px;height:46px;border-radius:16px;background:var(--pine);color:var(--on-pine);display:grid;place-items:center;margin-top:-6px}
.tab.add svg{stroke-width:2.4}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);justify-self:center;margin-top:4px}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.warnbox ul{margin:0;padding-inline-start:18px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.receipt{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}


.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;line-height:1.3}
.kpi .s{font-size:12px;color:var(--muted)}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:2}
.tbl{margin-top:6px;font-size:13px}
.tbl summary{color:var(--pine);cursor:pointer;padding:4px 0}
.tbl .wrap{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.hbar{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbar .track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:0 4px 4px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert:last-child{border-bottom:0}
.card-wrap{perspective:900px}
.card{background:linear-gradient(135deg,var(--c1,#1C5A47),var(--c2,#0d3328));color:#fff;border-radius:22px;padding:20px 20px 16px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;transform-style:preserve-3d;box-shadow:0 14px 30px -14px rgba(0,0,0,.55);min-height:212px;align-content:space-between;cursor:pointer;display:grid;gap:16px;position:relative;overflow:hidden;isolation:isolate}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.07;z-index:-1}
.card::before{width:220px;height:220px;inset-inline-start:-70px;top:-90px}
.card::after{width:160px;height:160px;inset-inline-end:-40px;bottom:-80px}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;gap:8px}
.card .bank{font-family:var(--f-display);font-size:15px}
.card .lbl{font-size:13px;opacity:.85}
.card .big{font-size:40px;font-weight:700;line-height:1.1}
.card .big .cur{font-size:16px;font-weight:500;opacity:.85;margin-inline-start:6px}
.card .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px}
.card .holder{font-size:17px;font-weight:600}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 2px;display:grid;justify-items:center;align-content:start;gap:4px;font-size:12px;line-height:1.3;text-align:center;font-weight:600;color:var(--ink);min-height:64px}
.act svg{width:22px;height:22px;fill:none;stroke:var(--pine);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acct-line{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.you{font-size:11px;font-weight:700;color:var(--pine);background:var(--pine-soft);padding:1px 8px;border-radius:99px;margin-inline-start:6px}
.link-list{display:grid;gap:8px}
.qrbox{background:#fff;border-radius:18px;padding:14px;justify-self:center;width:min(100%,280px);min-height:120px;display:grid;place-items:center}
.qrbox svg{display:block;width:100%;height:auto}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.money-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.card .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--sx,25%) var(--sy,15%),rgba(255,255,255,.22),transparent 55%);pointer-events:none;border-radius:inherit}
.emv{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#e9d18c,#b8913d 55%,#e2c57a);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.emv::before{content:"";position:absolute;inset:8px 0;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.emv::after{content:"";position:absolute;inset:0 15px;border-inline:1px solid rgba(0,0,0,.25)}
.card .mid{display:flex;justify-content:space-between;align-items:center}
.card .nfc{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;opacity:.85}
.card .big{font-size:34px}
.card-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.install{border:1px dashed var(--pine);background:var(--pine-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;margin-bottom:12px;font-size:14px}
.install ol{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.install .row button{background:none;border:0;color:var(--muted);font-size:13px}
.done{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.done-in{display:grid;justify-items:center;gap:10px;text-align:center;width:min(100%,380px)}
.tick{width:110px;height:110px}
.tick circle{fill:none;stroke:var(--good);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .55s ease-out forwards}
.tick path{fill:none;stroke:var(--good);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .35s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tick circle,.tick path{animation:none;stroke-dashoffset:0}.card{transition:none}}
.done-t{font-family:var(--f-display);font-size:24px}
.done-a{font-size:40px;font-weight:700}
.done-s{color:var(--muted);font-size:15px}
.done .btns{width:100%;margin-top:14px}
.stmt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.stmt-row .d{font-size:12px;color:var(--muted)}
.stmt-row .a{text-align:end;font-weight:700}
.stmt-row .rb{text-align:end;font-size:12px;color:var(--muted)}
.stmt-row.edge{font-weight:700;background:var(--sunk);padding-inline:10px;border-radius:10px;border:0}
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:360px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut-wrap svg{width:150px;height:150px;display:block}
.donut-c1{font-size:15px;font-weight:700;fill:var(--ink);font-family:var(--f-body)}
.donut-c2{font-size:9px;fill:var(--muted);font-family:var(--f-body)}
.dleg{display:grid;gap:6px;font-size:13px;min-width:0}
.dleg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg b{font-variant-numeric:tabular-nums}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ringbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:12px;color:var(--muted)}
.ringbox svg{width:96px;height:96px}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.motion{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.motion h4{margin:0;font-size:16px}
.tally{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.tally span{display:block;height:100%}
.votes3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.votes3 button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--ink)}
.votes3 button[aria-pressed="true"].y{background:var(--good);color:#fff;border-color:var(--good)}
.votes3 button[aria-pressed="true"].n{background:var(--bad);color:#fff;border-color:var(--bad)}
.votes3 button[aria-pressed="true"].a{background:var(--muted);color:var(--bg);border-color:var(--muted)}
.voters{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.voters span{background:var(--sunk);border-radius:99px;padding:2px 10px}
.danger-zone{border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
#toast{position:fixed;z-index:60;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

<body>
<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <h1 class="brand">صندوق العائلة<small id="sub">دفتر مشترك بلا ربا · إصدار 8</small></h1>

</div>

<nav class="tabs" id="nav" hidden dir="rtl" aria-label="الأقسام"><div class="in">

  <button class="tab" data-tab="ledger" id="t-ledger"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>العمليات</button>
  <button class="tab" data-tab="stats" id="t-stats"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 15l4-5 4 3 5-7"/></svg>الإحصاء</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
(function(){
"use strict";
var S={members:[],tx:[],deals:[],dists:[],notes:[],loaded:{},tab:"home",filter:"all",noDb:false,writable:true,uid:null,email:null,authed:null,setup:false,denied:false,denyWhat:"",settings:null,seenTx:{},bootAt:Date.now()};
function myMember(){return S.uid?S.members.find(function(m){return m.uid===S.uid})||null:null}
function myId(){var m=myMember();return m?m.id:null}
function acctNo(m){return String(m&&m.order||0).padStart(4,"0")}
function isAdmin(){return !!(S.settings&&S.uid&&S.settings.adminUid===S.uid)}
var db=null;
var COLS=["members","tx","deals","dists","notes"];
var TX={deposit:{l:"إيداع",s:1},withdraw:{l:"سحب",s:-1},qard_out:{l:"قرض حسن",s:-1},qard_in:{l:"سداد قرض",s:1},murabaha_buy:{l:"شراء مرابحة",s:-1},transfer:{l:"تحويل",s:0},liab_open:{l:"التزام جديد",s:0},liab_pay:{l:"سداد التزام",s:-1},murabaha_pay:{l:"قسط مرابحة",s:1},mudaraba_out:{l:"تمويل مضاربة",s:-1},mudaraba_close:{l:"إغلاق مضاربة",s:1}};
var KIND={qard:"قرض حسن",murabaha:"مرابحة",mudaraba:"مضاربة"};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function r2(n){return Math.round((+n+Number.EPSILON)*100)/100}
var NF=new Intl.NumberFormat("en-US",{maximumFractionDigits:2});
function money(n){return '<span class="num">'+NF.format(r2(n))+'</span>'}
function pct(n){return '<span class="num">'+(Math.round(n*1000)/10)+'٪</span>'}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s||""}}
function nameOf(id){var m=S.members.find(function(x){return x.id===id});return m?m.name:"—"}
function colorOf(id){var ms=sortedMembers();var i=ms.findIndex(function(x){return x.id===id});return "var(--m"+((i<0?0:i)%5+1)+")"}
function sortedMembers(){return S.members.slice().sort(function(a,b){return (a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name)})}
function loaded(){return COLS.every(function(c){return S.loaded[c]})}
function accountDay(){var now=new Date();now.setHours(0,0,0,0);for(var k=0;k<3;k++){var d=new Date(now.getFullYear(),now.getMonth()+k,1);while(d.getDay()!==5)d.setDate(d.getDate()+1);if(d>=now)return d}return now}
function isAccountDay(){var d=accountDay(),n=new Date();n.setHours(0,0,0,0);return d.getTime()===n.getTime()}
function cashOf(t){return t.type==="liab_open"?(t.cash?(+t.amount||0):0):t.type==="mudaraba_close"?(+t.cashIn||0):TX[t.type]?TX[t.type].s*(+t.amount||0):0}

var LIAB_KINDS={loan:"قرض للصندوق",note:"كمبيالة",account:"شراء بالحساب (آجل)",other:"التزام آخر"};
function liabStat(d){
  var txs=S.tx.filter(function(t){return t.deal===d.id}),paid=txs.filter(function(t){return t.type==="liab_pay"}).reduce(function(s,t){return s+(+t.amount)},0);
  var rem=r2((+d.amount||0)-paid),td=today();
  return {d:d,txs:txs,paid:r2(paid),remaining:Math.max(0,rem),open:rem>0.004,progress:d.amount>0?Math.min(1,paid/d.amount):0,overdue:rem>0.004&&d.due&&d.due<td,soon:rem>0.004&&d.due&&d.due>=td&&daysBetween(td,d.due)<=30};
}
function daysBetween(a,b){return Math.round((Date.parse(b+"T12:00:00")-Date.parse(a+"T12:00:00"))/86400000)}
function health(c){
  var de=c.equity>0?c.L/c.equity:(c.L>0?Infinity:0),da=c.assets>0?c.L/c.assets:0,lev=c.equity>0?c.assets/c.equity:0;
  var due30=c.liabs.filter(function(o){return o.overdue||o.soon}).reduce(function(s,o){return s+o.remaining},0);
  var cover=due30>0?c.cash/due30:Infinity,over=c.liabs.filter(function(o){return o.overdue}).length;
  var level=c.L<0.005?"none":(de<=0.3&&cover>=1&&!over)?"safe":(de<=0.7&&cover>=0.5)?"ok":"risk";
  return {de:de,da:da,lev:lev,due30:r2(due30),cover:cover,over:over,level:level};
}
function healthCard(c){
  var hh=health(c),lbl={none:["بلا ديون","good"],safe:["آمن","good"],ok:["مقبول، انتبهوا","warn"],risk:["خطر","bad"]}[hh.level];
  if(isPie()){var col=hh.level==="risk"?"var(--bad)":hh.level==="ok"?"var(--warn)":"var(--good)";
    return '<div class="panel stack"><div class="row"><b>سلامة الصندوق من الديون</b><span class="badge '+lbl[1]+'">'+lbl[0]+'</span></div><div class="rings">'+
      ring(hh.de===Infinity?1:hh.de,"الرفع المالي (الآمن 30٪ أو أقل)",col,hh.de===Infinity?"—":Math.round(hh.de*100)+"٪")+
      ring(hh.da,"الديون ÷ الأصول",col,Math.round(hh.da*100)+"٪")+
      ring(hh.lev>0?Math.min(1,(hh.lev-1)):0,"مضاعف الرفع (1× بلا ديون)","var(--m3)",(Math.round(hh.lev*100)/100)+"×")+
      ring(hh.due30>0?Math.min(1,hh.cover/2):1,"تغطية ديون 30 يوماً","var(--m1)",hh.due30>0?(Math.round(hh.cover*100)/100)+"×":"—")+'</div>'+
      (hh.over?'<div class="small" style="color:var(--bad);font-weight:600">'+hh.over+' التزام تجاوز موعد سداده.</div>':'')+'</div>'}
  function ratio(v){return v===Infinity?"—":'<span class="num">'+(Math.round(v*100)/100)+'</span>'}
  return '<div class="panel stack"><div class="row"><b>سلامة الصندوق من الديون</b><span class="badge '+lbl[1]+'">'+lbl[0]+'</span></div>'+
    '<div class="kpis">'+
    '<div class="kpi"><div class="k">الرفع المالي (الديون ÷ حقوق الملكية)</div><div class="v">'+(hh.de===Infinity?"—":pct(hh.de))+'</div><div class="s">الآمن 30٪ أو أقل</div></div>'+
    '<div class="kpi"><div class="k">الديون ÷ الأصول</div><div class="v">'+pct(hh.da)+'</div><div class="s">كم من أصولكم ممول بالدين</div></div>'+
    '<div class="kpi"><div class="k">مضاعف الرفع (الأصول ÷ حقوق الملكية)</div><div class="v">'+ratio(hh.lev)+'×</div><div class="s">1× يعني بلا ديون</div></div>'+
    '<div class="kpi"><div class="k">تغطية ديون الثلاثين يوماً</div><div class="v">'+(hh.due30>0?ratio(hh.cover)+'×':'—')+'</div><div class="s">'+(hh.due30>0?"مستحق "+NF.format(hh.due30)+" ج.م":"لا شيء مستحق قريباً")+'</div></div></div>'+
    (hh.over?'<div class="small" style="color:var(--bad);font-weight:600">'+hh.over+' التزام تجاوز موعد سداده.</div>':'')+'</div>';
}
function liabRow(o){var d=o.d;return '<button class="item'+(o.open?"":" closed")+'" data-act="open-liab" data-id="'+esc(d.id)+'"><div class="t">'+esc((LIAB_KINDS[d.lkind]||"التزام")+" — "+(d.creditor||""))+'</div><div class="a">'+(o.overdue?'<span class="badge bad">متأخر</span>':o.open?'<span class="badge warn">قائم</span>':'<span class="badge good">مسدد</span>')+'</div><div class="d">'+esc("الباقي "+NF.format(o.remaining)+" من "+NF.format(d.amount)+(d.due?" · يستحق "+fdate(d.due):""))+'</div><div class="prog"><div class="meter"><i style="width:'+(o.progress*100)+'%"></i></div></div></button>'}
function motions(){return S.notes.filter(function(n){return n.kind==="motion"})}
function motionState(m){
  var total=S.members.length,v=m.votes||{},ids=S.members.map(function(x){return x.id}),yes=0,no=0,ab=0;
  ids.forEach(function(id){if(v[id]==="yes")yes++;else if(v[id]==="no")no++;else if(v[id]==="abstain")ab++});
  var voted=yes+no+ab,need=m.mtype==="charter"?total:Math.floor(total/2)+1;
  var passedNow=yes>=need,deadNow=m.mtype==="charter"?no>0||ab>0:(no+ab)>total-need;
  var expired=m.deadline&&m.deadline<today();
  var closed=!!m.closed||voted>=total||expired||passedNow||deadNow;
  var result=m.closed?m.result:passedNow?"passed":"rejected";
  return {yes:yes,no:no,ab:ab,voted:voted,total:total,need:need,closed:closed,result:closed?result:null};
}
function assemblyCard(){
  var open=motions().filter(function(m){return !motionState(m).closed}).length;
  return '<div class="panel row" style="margin-top:12px"><div><b>الجمعية العمومية</b><div class="small muted">'+(open?open+" تصويت مفتوح":"لا تصويت مفتوح الآن")+'</div></div><button class="btn'+(open?"":" ghost")+'" data-tab="assembly">'+(open?"صوّت الآن":"ادخل")+'</button></div>';
}
function myPendingVotes(){var mi=myId();if(!mi)return "";var n=motions().filter(function(m){return !motionState(m).closed&&!(m.votes||{})[mi]}).length;
  return n?'<div class="callout" style="margin-top:12px"><div class="small"><b>الجمعية العمومية:</b> '+n+' قرار ينتظر صوتك.</div><button class="btn" data-tab="assembly">صوّت الآن</button></div>':""}
function motionCard(m){
  var st=motionState(m),mi=myId(),my=(m.votes||{})[mi],v=m.votes||{};
  var h='<div class="motion"><div class="row"><h4>'+esc(m.title)+'</h4>'+(st.closed?'<span class="badge '+(st.result==="passed"?"good":"bad")+'">'+(st.result==="passed"?"أُقِرّ":"رُفض")+'</span>':'<span class="badge warn">مفتوح</span>')+'</div>';
  if(m.text)h+='<div class="small" style="white-space:pre-wrap">'+esc(m.text)+'</div>';
  h+='<div class="small muted">'+(m.mtype==="charter"?"قرار كبير: يحتاج الإجماع":"قرار عادي: يحتاج "+st.need+" من "+st.total)+' · اقترحه '+esc(nameOf(m.member))+(m.deadline?' · ينتهي '+esc(fdate(m.deadline)):'')+'</div>';
  h+='<div class="tally" aria-hidden="true">'+(st.yes?'<span style="flex:'+st.yes+';background:var(--good)"></span>':'')+(st.no?'<span style="flex:'+st.no+';background:var(--bad)"></span>':'')+(st.ab?'<span style="flex:'+st.ab+';background:var(--muted)"></span>':'')+(st.total-st.voted>0?'<span style="flex:'+(st.total-st.voted)+';background:var(--sunk)"></span>':'')+'</div>';
  h+='<div class="small">نعم <b>'+st.yes+'</b> · لا <b>'+st.no+'</b> · ممتنع <b>'+st.ab+'</b> · لم يصوّت <b>'+(st.total-st.voted)+'</b></div>';
  h+='<div class="voters">'+sortedMembers().map(function(x){var vv=v[x.id];return '<span>'+esc(x.name)+': '+(vv==="yes"?"نعم":vv==="no"?"لا":vv==="abstain"?"ممتنع":"—")+'</span>'}).join("")+'</div>';
  if(!st.closed&&mi)h+='<div class="votes3"><button class="y" data-act="vote" data-id="'+esc(m.id)+'" data-v="yes" aria-pressed="'+(my==="yes")+'">نعم</button><button class="n" data-act="vote" data-id="'+esc(m.id)+'" data-v="no" aria-pressed="'+(my==="no")+'">لا</button><button class="a" data-act="vote" data-id="'+esc(m.id)+'" data-v="abstain" aria-pressed="'+(my==="abstain")+'">ممتنع</button></div>';
  if(st.closed&&m.closedAt)h+='<div class="small muted">المحضر: أُغلق التصويت في '+esc(fdate(m.closedAt))+(m.minutes?' · '+esc(m.minutes):'')+'</div>';
  if(isAdmin())h+='<div class="btns">'+(!m.closed?'<button class="btn ghost" data-act="close-motion" data-id="'+esc(m.id)+'">'+(st.closed?"حفظ المحضر":"إقفال التصويت")+'</button>':'')+'<button class="btn danger" data-act="del-motion" data-id="'+esc(m.id)+'">حذف</button></div>';
  return h+'</div>';
}
function vAssembly(c){
  var all=motions().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}),open=all.filter(function(m){return !motionState(m).closed}),done=all.filter(function(m){return motionState(m).closed});
  var h='<h2 class="sec">الجمعية العمومية'+(myMember()?'<button class="chip" data-act="add-motion">+ اقتراح</button>':'')+'</h2><p class="small muted" style="margin:0 0 10px">صوت واحد لكل عضو مهما كانت حصته. القرار العادي يحتاج أغلبية الأعضاء، والقرار الكبير مثل تعديل الميثاق يحتاج الإجماع.</p>';
  h+=open.length?'<div class="stack">'+open.map(motionCard).join("")+'</div>':'<div class="empty"><p>لا قرارات مطروحة. اقترح قراراً ليصوّت عليه الجميع، مثل تغيير نسبة الاحتياطي أو بدء مشروع.</p></div>';
  if(done.length)h+='<h2 class="sec">سجل القرارات</h2><div class="stack">'+done.map(motionCard).join("")+'</div>';
  return h+'<button class="btn ghost block" style="margin-top:14px" data-tab="fund">رجوع إلى الصندوق</button>';
}
function openAddMotion(){
  if(!myMember()){toast("اربط حسابك أولاً");return}sheetState={kind:"motion-add"};
  var d=new Date();d.setDate(d.getDate()+3);var dd=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  openSheet('<h3>اقتراح قرار</h3><form id="motionForm" class="stack" novalidate><div class="field"><label for="mo-title">القرار المقترح</label><input id="mo-title" type="text" placeholder="مثلاً: رفع الاحتياطي إلى 25٪"></div><div class="field"><label for="mo-text">التفاصيل والأسباب</label><textarea id="mo-text"></textarea></div><div class="grid2"><div class="field"><label for="mo-type">نوع القرار</label><select id="mo-type"><option value="ordinary">عادي: بالأغلبية</option><option value="charter">كبير: بالإجماع</option></select></div><div class="field"><label for="mo-dl">آخر موعد للتصويت</label><input id="mo-dl" type="date" value="'+dd+'"></div></div><div id="moMsg"></div><div class="btns"><button type="submit" class="btn">طرح للتصويت</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>');
}
async function submitMotion(ev){ev.preventDefault();var t=val("mo-title").trim();if(!t){showMsg($("#moMsg"),'<p class="err">اكتب القرار المقترح.</p>');return}
  var doc={kind:"motion",title:t,text:val("mo-text").trim(),mtype:val("mo-type"),deadline:val("mo-dl"),member:myId(),votes:{},closed:false,by:S.email||null,createdAt:Date.now()};
  if(await w(function(){return db.collection("notes").doc().set(doc)})){closeSheet();S.tab="assembly";render();toast("طُرح القرار للتصويت")}}
function castVote(id,v){var mi=myId(),m=S.notes.find(function(x){return x.id===id});if(!mi||!m)return;if(motionState(m).closed){toast("أُغلق التصويت");return}
  var u={};u["votes."+mi]=v;w(function(){return db.doc("notes/"+id).update(u)}).then(function(ok){if(ok)toast("سُجّل صوتك")})}
function closeMotion(id){if(!isAdmin())return;var m=S.notes.find(function(x){return x.id===id});if(!m)return;var st=motionState(m);
  var res=st.yes>=st.need?"passed":"rejected";
  w(function(){return db.doc("notes/"+id).update({closed:true,result:res,closedAt:today(),minutes:"نعم "+st.yes+"، لا "+st.no+"، ممتنع "+st.ab+" من "+st.total})}).then(function(ok){if(ok)toast(res==="passed"?"أُقِرّ القرار":"رُفض القرار")})}

/* ---------- reset & backup ---------- */
function dangerZone(){if(!isAdmin())return "";return '<h2 class="sec">إدارة البيانات</h2><div class="danger-zone"><div class="small">احفظ نسخة من كل بيانات الصندوق في ملف على جهازك، أو أعد الصندوق إلى البداية.</div><div class="btns"><button class="btn ghost" data-act="backup">تنزيل نسخة احتياطية</button><button class="btn danger" data-act="reset-open">تصفير الصندوق</button></div></div>'}
function backup(){
  var data={exportedAt:new Date().toISOString(),version:8,settings:S.settings,members:S.members,tx:S.tx,deals:S.deals,dists:S.dists,notes:S.notes};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="bank-of-thamer-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},2000);toast("نُزّلت النسخة الاحتياطية");
}
function openReset(){
  if(!isAdmin())return;sheetState={kind:"reset"};
  openSheet('<h3>تصفير الصندوق</h3><p style="margin:0">سيُحذف نهائياً: كل العمليات والعقود والالتزامات والتوزيعات والأهداف والملاحظات وقرارات الجمعية وصور الفواتير، وتعود كل الأرصدة والعدادات إلى الصفر.</p><p class="small muted" style="margin:0">ننصح بتنزيل نسخة احتياطية قبل التصفير.</p><button class="btn ghost block" data-act="backup">تنزيل نسخة احتياطية أولاً</button>'+

function dealStat(d){
  var txs=S.tx.filter(function(t){return t.deal===d.id});
  var o={d:d,txs:txs,open:true,outCost:0,paid:0,total:0,remaining:0,progress:0};
  if(d.kind==="qard"){o.total=+d.amount;o.paid=txs.filter(function(t){return t.type==="qard_in"}).reduce(function(s,t){return s+(+t.amount)},0);o.remaining=r2(o.total-o.paid);o.outCost=Math.max(0,o.remaining)}
  else if(d.kind==="murabaha"){o.total=+d.price;o.paid=txs.filter(function(t){return t.type==="murabaha_pay"}).reduce(function(s,t){return s+(+t.amount)},0);o.remaining=r2(o.total-o.paid);o.outCost=d.price>0?Math.max(0,o.remaining)*d.cost/d.price:0}
  else if(d.kind==="mudaraba"){var cl=txs.find(function(t){return t.type==="mudaraba_close"});o.total=+d.capital;o.closeTx=cl||null;o.remaining=cl?0:o.total;o.paid=cl?o.total:0;o.outCost=cl?0:o.total}
  o.open=o.remaining>0.004;o.progress=o.total>0?Math.min(1,o.paid/o.total):0;return o;
}
function calc(){
  var bal={};S.members.forEach(function(m){bal[m.id]={dep:0,wd:0,dist:0}});
  var cash=0,profit=0;
  S.tx.forEach(function(t){cash+=cashOf(t);profit+=(+t.profit||0);if(t.type==="transfer"){if(bal[t.member])bal[t.member].wd+=(+t.amount);if(bal[t.to])bal[t.to].dep+=(+t.amount)}if(bal[t.member]){if(t.type==="deposit")bal[t.member].dep+=(+t.amount);if(t.type==="withdraw")bal[t.member].wd+=(+t.amount)}});
  var distributed=0;S.dists.forEach(function(d){distributed+=(+d.total||0);var a=d.alloc||{};Object.keys(a).forEach(function(k){if(bal[k])bal[k].dist+=(+a[k])})});
  var deals=S.deals.filter(function(d){return d.kind!=="liab"}).map(dealStat);
  var liabs=S.deals.filter(function(d){return d.kind==="liab"}).map(liabStat);
  var L=liabs.reduce(function(s,o){return s+o.remaining},0),other=liabs.filter(function(o){return !o.d.cash}).reduce(function(s,o){return s+(+o.d.amount||0)},0);
  var recv=deals.reduce(function(s,o){return s+o.outCost},0);
  var members=sortedMembers().map(function(m){var b=bal[m.id];return {m:m,balance:r2(b.dep-b.wd+b.dist),dist:r2(b.dist)}});
  var sumBal=members.reduce(function(s,x){return s+x.balance},0);
  members.forEach(function(x){x.share=sumBal>0?x.balance/sumBal:0});
  var undist=r2(profit-distributed);
  var equity=r2(sumBal+undist),assets=r2(cash+recv+other);
  return {cash:r2(cash),recv:r2(recv),profit:r2(profit),distributed:r2(distributed),undist:undist,equity:equity,assets:assets,sumBal:r2(sumBal),members:members,deals:deals,liabs:liabs,L:r2(L),other:r2(other),diff:r2(assets-L-equity)};
}

/* ---------- statistics ---------- */
var CHART_MODE="bars";try{CHART_MODE=localStorage.getItem("bot-charts")||"bars"}catch(e){}
function isPie(){return CHART_MODE==="pie"}
function modeToggle(){return '<div class="seg" role="group" aria-label="شكل الرسوم"><button data-act="chart-mode" data-id="bars" aria-pressed="'+!isPie()+'">أعمدة وخطوط</button><button data-act="chart-mode" data-id="pie" aria-pressed="'+isPie()+'">دوائر</button></div>'}
var PIE_COLORS=["var(--m1)","var(--m2)","var(--m3)","var(--m4)","var(--m5)"];
function donut(items,center,sub){
  items=items.filter(function(x){return x.value>0.004});var tot=items.reduce(function(s,x){return s+x.value},0);
  if(!(tot>0))return '<div class="empty"><p>لا أرقام تُعرض بعد.</p></div>';
  var R=58,C=2*Math.PI*R,acc=0,gap=items.length>1?2:0;
  var arcs=items.map(function(x,i){var len=x.value/tot*C,seg='<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="'+(x.color||PIE_COLORS[i%5])+'" stroke-width="24" stroke-dasharray="'+Math.max(0,len-gap).toFixed(2)+' '+(C-Math.max(0,len-gap)).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 75 75)"><title>'+esc(x.label)+': '+NF.format(r2(x.value))+'</title></circle>';acc+=len;return seg}).join("");
  var svg='<svg viewBox="0 0 150 150" role="img" aria-label="'+esc(items.map(function(x){return x.label}).join("، "))+'"><circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--sunk)" stroke-width="24"/>'+arcs+'<text x="75" y="76" text-anchor="middle" class="donut-c1">'+esc(center||"")+'</text><text x="75" y="92" text-anchor="middle" class="donut-c2">'+esc(sub||"")+'</text></svg>';
  var leg='<div class="dleg">'+items.map(function(x,i){return '<div><i style="background:'+(x.color||PIE_COLORS[i%5])+'"></i><span>'+esc(x.label)+'</span><b>'+NF.format(r2(x.value))+' · '+(Math.round(x.value/tot*1000)/10)+'٪</b></div>'}).join("")+'</div>';
  return '<div class="panel donut-wrap" dir="rtl">'+svg+leg+'</div>';
}
function ring(frac,label,color,txt){var R=36,C=2*Math.PI*R,f=Math.max(0,Math.min(1,frac||0));
  return '<div class="ringbox"><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="'+R+'" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle cx="48" cy="48" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(f*C).toFixed(2)+' '+C.toFixed(2)+'" transform="rotate(-90 48 48)"/><text x="48" y="53" text-anchor="middle" class="donut-c1">'+esc(txt)+'</text></svg><span>'+esc(label)+'</span></div>'}
var CH={};
var CF=new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:1});
function niceStep(x){if(!(x>0))return 1;var p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function yRange(vals){var lo=Math.min(0,Math.min.apply(null,vals)),hi=Math.max(0,Math.max.apply(null,vals));var st=niceStep((hi-lo)/4||1);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;var t=[];for(var v=lo;v<=hi+st/2;v+=st)t.push(r2(v));return {lo:lo,hi:hi,ticks:t}}
function shortDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short"})}catch(e){return s}}
function monthLabel(m){try{return new Date(m+"-15T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{month:"short",year:"2-digit"})}catch(e){return m}}

function equitySeries(){
  var tx=S.tx.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))||(a.createdAt||0)-(b.createdAt||0)});
  var map={},eq=0,cash=0;
  tx.forEach(function(t){cash+=cashOf(t);if(t.type==="deposit")eq+=(+t.amount);if(t.type==="withdraw")eq-=(+t.amount);eq+=(+t.profit||0);map[t.date]={eq:r2(eq),cash:r2(cash)}});
  return Object.keys(map).sort().map(function(d){return {key:d,label:shortDate(d),x:Date.parse(d+"T12:00:00"),v:map[d]}});
}
function monthlyProfit(){
  var by={};S.tx.forEach(function(t){if(t.profit){var m=String(t.date).slice(0,7);by[m]=(by[m]||0)+(+t.profit)}});
  var first=S.tx.reduce(function(m,t){var k=String(t.date).slice(0,7);return !m||k<m?k:m},null);if(!first)return [];
  var now=today().slice(0,7),out=[],y=+first.slice(0,4),mo=+first.slice(5,7);
  while(true){var k=y+"-"+String(mo).padStart(2,"0");out.push({key:k,label:monthLabel(k),v:{p:r2(by[k]||0)}});if(k>=now||out.length>36)break;mo++;if(mo>12){mo=1;y++}}
  return out.slice(-12);
}
function lateItems(c){
  var out=[],td=today(),now=new Date();
  c.deals.forEach(function(o){var d=o.d;if(!o.open)return;
    if(d.kind==="qard"&&d.due&&d.due<td)out.push({who:d.member,txt:"قرض حسن تجاوز موعد رده ("+fdate(d.due)+")، والباقي "+NF.format(o.remaining)+" ج.م"});
    if(d.kind==="murabaha"){var st=new Date(d.date+"T12:00:00");var m=(now.getFullYear()-st.getFullYear())*12+(now.getMonth()-st.getMonth())-(now.getDate()<st.getDate()?1:0);var exp=Math.min(d.price,Math.max(0,m)*d.price/d.installments);if(o.paid+0.01<exp)out.push({who:d.member,txt:"أقساط «"+(d.item||"مرابحة")+"» متأخرة بمقدار "+NF.format(r2(exp-o.paid))+" ج.م"})}
  });return out;
}

function lineChart(id,pts,keys){
  var W=340,H=190,L=44,R=12,T=12,B=26;
  var vals=[];pts.forEach(function(p){keys.forEach(function(k){vals.push(p.v[k.k])})});
  var yr=yRange(vals),x0=pts[0].x,x1=pts[pts.length-1].x;if(x0===x1){x0-=86400000*3;x1+=86400000*3}
  function X(x){return L+(x-x0)/(x1-x0)*(W-L-R)}function Y(v){return T+(yr.hi-v)/(yr.hi-yr.lo)*(H-T-B)}
  var g=yr.ticks.map(function(t){return '<line class="'+(t===0?"base":"grid")+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+CF.format(t)+'</text>'}).join("");
  var xl=[pts[0]];if(pts.length>2)xl.push(pts[Math.floor((pts.length-1)/2)]);if(pts.length>1)xl.push(pts[pts.length-1]);
  g+=xl.map(function(p,i){return '<text class="ax" x="'+X(p.x)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===xl.length-1?"end":"middle")+'">'+esc(p.label)+'</text>'}).join("");
  var marks=keys.map(function(k,ki){var d=pts.map(function(p,i){return (i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.v[k.k]).toFixed(1)}).join(" ");
    var area=ki===0&&pts.length>1?'<path d="'+d+" L"+X(pts[pts.length-1].x).toFixed(1)+" "+Y(Math.max(0,yr.lo))+" L"+X(pts[0].x).toFixed(1)+" "+Y(Math.max(0,yr.lo))+' Z" fill="'+k.c+'" fill-opacity=".12" stroke="none"/>':"";
    var last=pts[pts.length-1];
    return area+(pts.length>1?'<path d="'+d+'" fill="none" stroke="'+k.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':"")+'<circle cx="'+X(last.x)+'" cy="'+Y(last.v[k.k])+'" r="4" fill="'+k.c+'" stroke="var(--surface)" stroke-width="2"/>'}).join("");
  CH[id]={type:"line",pts:pts,keys:keys,W:W,H:H,X:X,Y:Y,T:T,B:B,xs:pts.map(function(p){return X(p.x)})};
  return chartWrap(id,keys,'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(keys.map(function(k){return k.l}).join(" و "))+'">'+g+marks+'<g class="hov"></g></svg>',pts);
}
function barChart(id,pts,key){
  var W=340,H=170,L=44,R=12,T=12,B=26;
  var yr=yRange(pts.map(function(p){return p.v[key.k]}));var band=(W-L-R)/pts.length,bw=Math.min(28,band*0.6);
  function Y(v){return T+(yr.hi-v)/(yr.hi-yr.lo)*(H-T-B)}function CX(i){return L+band*i+band/2}
  var g=yr.ticks.map(function(t){return '<line class="'+(t===0?"base":"grid")+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+CF.format(t)+'</text>'}).join("");
  var every=Math.ceil(pts.length/6);
  g+=pts.map(function(p,i){return i%every===0||i===pts.length-1?'<text class="ax" x="'+CX(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.label)+'</text>':""}).join("");
  var bars=pts.map(function(p,i){var v=p.v[key.k];if(!v)return "";var y0=Y(0),y1=Y(v),top=Math.min(y0,y1),h=Math.max(1,Math.abs(y1-y0));return '<rect x="'+(CX(i)-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+key.c+'"/>'}).join("");
  CH[id]={type:"bar",pts:pts,keys:[key],W:W,H:H,T:T,B:B,xs:pts.map(function(p,i){return CX(i)}),Y:Y};
  return chartWrap(id,null,'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(key.l)+'">'+g+bars+'<g class="hov"></g></svg>',pts,[key]);
}
function chartWrap(id,legendKeys,svg,pts,tableKeys){
  var keys=legendKeys||tableKeys;
  var leg=legendKeys&&legendKeys.length>1?'<div class="legend">'+legendKeys.map(function(k){return '<span><i style="background:'+k.c+'"></i>'+esc(k.l)+'</span>'}).join("")+'</div>':"";
  var tbl='<details class="tbl"><summary>عرض الأرقام</summary><div class="wrap"><table><thead><tr><th>التاريخ</th>'+keys.map(function(k){return "<th>"+esc(k.l)+"</th>"}).join("")+'</tr></thead><tbody>'+pts.slice().reverse().map(function(p){return "<tr><td>"+esc(p.label)+"</td>"+keys.map(function(k){return "<td>"+NF.format(p.v[k.k])+"</td>"}).join("")+"</tr>"}).join("")+'</tbody></table></div></details>';
  return '<div class="chart" data-chart="'+id+'" dir="ltr">'+leg+svg+'<div class="tip" hidden></div></div>'+tbl;
}
function chartHover(e){
  var box=e.target.closest&&e.target.closest(".chart");if(!box)return;var ch=CH[box.dataset.chart];if(!ch)return;
  var svg=box.querySelector("svg"),rc=svg.getBoundingClientRect(),sx=(e.clientX-rc.left)/rc.width*ch.W;
  var i=0,best=1e9;ch.xs.forEach(function(x,j){var d=Math.abs(x-sx);if(d<best){best=d;i=j}});
  var p=ch.pts[i],x=ch.xs[i],hov=svg.querySelector(".hov");
  var h='<line x1="'+x+'" x2="'+x+'" y1="'+ch.T+'" y2="'+(ch.H-ch.B)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>';
  if(ch.type==="line")h+=ch.keys.map(function(k){return '<circle cx="'+x+'" cy="'+ch.Y(p.v[k.k])+'" r="5" fill="'+k.c+'" stroke="var(--surface)" stroke-width="2"/>'}).join("");
  hov.innerHTML=h;
  var tip=box.querySelector(".tip");tip.hidden=false;
  tip.innerHTML='<div dir="rtl"><b>'+esc(p.label)+'</b>'+ch.keys.map(function(k){return '<div>'+esc(k.l)+': <span class="num">'+NF.format(p.v[k.k])+'</span></div>'}).join("")+'</div>';
  var px=x/ch.W*rc.width+(rc.left-box.getBoundingClientRect().left),tw=tip.offsetWidth,bw=box.clientWidth;
  tip.style.left=Math.max(4,Math.min(bw-tw-4,px-tw/2))+"px";
}
function chartLeave(e){var box=e.target;if(!box.classList||!box.classList.contains("chart"))return;var t=box.querySelector(".tip");if(t)t.hidden=true;var h=box.querySelector(".hov");if(h)h.innerHTML=""}

function normDigits(x){return String(x==null?"":x).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-0x0660}).replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-0x06F0}).replace(/[\u066B\u060C]/g,".").replace(/[\u066C,\s]/g,"")}

function updateMPrev(){var p=$("#mPrev");if(!p)return;var cost=numv("f-amount"),mk=numv("f-markup"),n=Math.max(1,Math.round(numv("f-inst")||1));var price=r2(cost*(1+mk/100));p.innerHTML='<div class="row"><span class="muted">سعر البيع للعضو</span><b>'+money(price)+'</b></div><div class="row"><span class="muted">القسط الشهري</span><b>'+money(price/n)+'</b></div><div class="row"><span class="muted">ربح الصندوق</span><b>'+money(price-cost)+'</b></div>'}

function warnsFor(t,amount,member,c){
  var w=[];var after=c.cash-(t==="deposit"?-amount:amount);
  if(t!=="deposit"&&after<c.equity*0.2-0.004)w.push("سيبقى في الصندوق نقد أقل من الاحتياطي (20٪ = "+NF.format(r2(c.equity*0.2))+").");
  if((t==="murabaha"||t==="mudaraba")&&amount>c.equity*0.4+0.004)w.push("المبلغ يتجاوز 40٪ من الصندوق، وهو حد العملية الواحدة في الميثاق.");
  if(t==="qard"){var outQ=c.deals.filter(function(o){return o.d.kind==="qard"&&o.open&&o.d.member===member}).reduce(function(s,o){return s+o.remaining},0);if(outQ+amount>c.equity*0.1+0.004)w.push("القروض الحسنة لهذا العضو ستتجاوز 10٪ من الصندوق.")}
  if(t==="murabaha"&&c.deals.some(function(o){return o.d.kind==="murabaha"&&o.open&&o.d.member===member}))w.push("لهذا العضو مرابحة لم تكتمل بعد، والميثاق يسمح بواحدة نشطة.");
  if((t==="deposit"||t==="withdraw")&&!isAccountDay()&&S.tx.some(function(x){return x.type==="deposit"}))w.push("الميثاق يجعل الإيداع والسحب في يوم الحساب، بعد توزيع الأرباح.");
  return w;
}
async function submitAdd(ev){
  ev.preventDefault();
  var t=sheetState.type,c=calc(),member=val("f-member"),amount=r2(numv("f-amount")),date=val("f-date")||today(),note=val("f-note").trim();
  var msg=$("#addMsg");function err(s){showMsg(msg,'<p class="err">'+esc(s)+'</p>');toast(s)}
  if(!member||member!==myId())return err("لا تُسجَّل العمليات إلا على حسابك.");
  if(!(amount>0))return err("اكتب مبلغاً أكبر من صفر.");
  if(t!=="deposit"&&amount>c.cash+0.004)return err("النقد المتاح في الصندوق "+NF.format(c.cash)+" ج.م فقط، وهو لا يكفي لهذه العملية.");
  if(t==="withdraw"){var mb=c.members.find(function(x){return x.m.id===member});if(!mb||amount>mb.balance+0.004)return err("رصيد "+nameOf(member)+" "+NF.format(mb?mb.balance:0)+" ج.م، ولا يمكن سحب أكثر منه.")}
  if((t==="murabaha"||t==="mudaraba")&&!val("f-item").trim())return err(t==="murabaha"?"اكتب اسم الغرض.":"اكتب اسم المشروع.");
  if(!sheetState.ack){var wl=warnsFor(t,amount,member,c);if(wl.length){sheetState.ack=true;showMsg(msg,'<div class="warnbox"><b>تنبيه من الميثاق</b><ul>'+wl.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul><span>اضغط «حفظ رغم ذلك» إن اتفقتم على هذا.</span></div>');$("#addSubmit").textContent="حفظ رغم ذلك";return}}
  var btn=$("#addSubmit");btn.disabled=true;btn.textContent="جارٍ الحفظ…";
  var receipt=await uploadReceipt("f-receipt");if(receipt===false){btn.disabled=false;btn.textContent="حفظ";return}
  var base={amount:amount,date:date,member:member,note:note,by:S.email||null,createdAt:Date.now()};if(receipt)base.receipt=receipt;
  unlockAudio();var doneTx=null;
  var ok=await w(async function(){
    if(t==="deposit"||t==="withdraw"){var tref=db.collection("tx").doc();doneTx=Object.assign({id:tref.id,type:t},base);await tref.set(Object.assign({type:t},base))}
    else{
      var dref=db.collection("deals").doc(),deal={kind:t,member:member,date:date,note:note,createdAt:Date.now()};
      if(t==="qard"){deal.amount=amount;deal.due=val("f-due")||""}
      if(t==="murabaha"){var mk=numv("f-markup"),n=Math.max(1,Math.round(numv("f-inst")||1));deal.item=val("f-item").trim();deal.cost=amount;deal.markup=mk;deal.price=r2(amount*(1+mk/100));deal.installments=n}
      if(t==="mudaraba"){deal.item=val("f-item").trim();deal.capital=amount;deal.workerShare=Math.min(100,Math.max(0,numv("f-worker")))/100}
      await Promise.all([dref.set(deal),db.collection("tx").add(Object.assign({type:t==="qard"?"qard_out":t==="murabaha"?"murabaha_buy":"mudaraba_out",deal:dref.id},base,deal.item?{note:note||deal.item}:{}))]);
    }
  });
  if(ok){closeSheet();showDone({title:t==="deposit"?"تمّ الإيداع":t==="withdraw"?"تمّ السحب":t==="murabaha"?"تمّ الشراء بالتقسيط":t==="qard"?"تمّ صرف القرض":"تمّ تمويل المشروع",amount:amount,sub:doneTx?"في حساب "+nameOf(member):(val("f-item")||"").trim(),tx:doneTx})}else{btn.disabled=false;btn.textContent="حفظ"}
}
async function uploadReceipt(id){
  var inp=document.getElementById(id);if(!inp||!inp.files||!inp.files[0])return null;
  try{var data=await compressImage(inp.files[0]);var ref=doc(collection(FS,"receipts"));setDoc(ref,{data:data,createdAt:Date.now(),by:S.email||null}).catch(writeFailed);return ref.id}
  catch(e){toast("تعذر قراءة الصورة، جرّب صورة أخرى أو احفظ بدونها");return false}
}
function compressImage(file){return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();img.onload=function(){try{var max=1400,sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);var q=.72,out=cv.toDataURL("image/jpeg",q);while(out.length>900000&&q>.3){q-=.12;out=cv.toDataURL("image/jpeg",q)}URL.revokeObjectURL(url);if(out.length>1000000)return rej(new Error("big"));res(out)}catch(e){rej(e)}};img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}

function openTx(id){
  var t=S.tx.find(function(x){return x.id===id});if(!t)return;
  var cash=t.type==="transfer"?(t.to===myId()?+t.amount:-t.amount):cashOf(t);sheetState={kind:"tx",id:id,confirm:false};
  var h='<h3>'+esc(TX[t.type]?TX[t.type].l:t.type)+'</h3><dl class="kv"><dt>المبلغ</dt><dd class="'+(cash>=0?"plus":"minus")+'"><b>'+(cash>=0?"+":"−")+money(Math.abs(cash))+' ج.م</b></dd><dt>'+(t.type==="transfer"?"من":"العضو")+'</dt><dd>'+esc(nameOf(t.member))+'</dd>'+(t.type==="transfer"?'<dt>إلى</dt><dd>'+esc(nameOf(t.to))+'</dd>':'')+'<dt>التاريخ</dt><dd>'+esc(fdate(t.date))+'</dd>'+
    (t.profit?'<dt>ربح الصندوق</dt><dd>'+money(t.profit)+'</dd>':'')+(t.type==="mudaraba_close"?'<dt>حصيلة البيع</dt><dd>'+money(t.amount)+'</dd><dt>نصيب العامل</dt><dd>'+money(t.workerProfit||0)+'</dd>':'')+
    (t.note?'<dt>ملاحظة</dt><dd>'+esc(t.note)+'</dd>':'')+'<dt>سجّلها</dt><dd id="byName">…</dd></dl>'+
    (t.receipt?'<img class="receipt" id="rcptImg" alt="صورة الفاتورة" hidden><p class="small muted" id="rcptMsg">جارٍ تحميل الفاتورة…</p>':'');
  var creates=t.deal&&/_out$|_buy$/.test(t.type);
  if(t.member===myId()||isAdmin())h+='<div id="delMsg" class="small muted">'+(creates?"حذف هذه العملية يحذف العقد كله وكل أقساطه.":"")+'</div><div class="btns"><button class="btn danger" data-act="del-tx">حذف العملية</button><button class="btn ghost" data-act="close">إغلاق</button></div>';
  else h+='<button class="btn ghost block" data-act="close">إغلاق</button>';

  var ua=navigator.userAgent||"",ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),crios=/CriOS|FxiOS|EdgiOS/.test(ua);
  var h='<div class="install"><div class="row"><b>ثبّت الصندوق كتطبيق على شاشتك</b><button data-act="install-hide" aria-label="إخفاء">إخفاء</button></div>';

  else if(ios)h+='<ol><li>'+(crios?'اضغط زر المشاركة ⬆ بجانب شريط العنوان في الأعلى.':'اضغط زر المشاركة ⬆ في أسفل الشاشة. في iOS 26 اضغط أولاً على ⋯ ثم «مشاركة».')+'</li><li>مرّر القائمة إلى الأسفل واختر <b>«إضافة إلى الشاشة الرئيسية»</b>. إن لم تجده، اضغط «تعديل الإجراءات» في آخر القائمة وأضفه.</li><li>اضغط <b>«إضافة»</b>، وافتح الصندوق من أيقونته بعد ذلك.</li></ol><div class="small muted">إن فتحت الرابط من داخل واتساب أو تيليجرام أو Claude، افتحه أولاً في Safari، فالإضافة لا تظهر داخل هذه التطبيقات.</div><div class="small"><b>طريقة بديلة مضمونة:</b> <a href="install.mobileconfig" style="color:var(--pine);font-weight:700">نزّل ملف التثبيت</a>، ثم افتح <b>الإعدادات</b> واضغط <b>«تم تنزيل ملف التعريف»</b> ثم <b>«تثبيت»</b>. ستظهر أيقونة البنك على شاشتك.</div>';
  else h+='<div class="small">من قائمة المتصفح ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</div>';
  return h+'</div>';

/* ---------- transfers & QR ---------- */
var SCAN={stream:null,raf:0};
function loadScript(urls){return new Promise(function(res,rej){var i=0;(function next(){if(i>=urls.length)return rej(new Error("load"));var sc=document.createElement("script");sc.src=urls[i++];sc.onload=function(){res()};sc.onerror=function(){sc.remove();next()};document.head.appendChild(sc)})()})}
function ensureQRGen(){return window.makeQR?Promise.resolve():loadScript(["lib/qrgen.js"])}
function ensureJsQR(){return window.jsQR?Promise.resolve():loadScript(["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js","https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"])}
function qrSvg(text){var q=window.makeQR(text),n=q.count,m=4,sz=n+m*2,d="";for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";return '<svg viewBox="0 0 '+sz+' '+sz+'" shape-rendering="crispEdges" role="img" aria-label="رمز الاستلام"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
function payText(id,amount){return "BOT-PAY:"+id+(amount>0?":"+r2(amount):"")}
function parsePay(t){var m=/^BOT-PAY:([A-Za-z0-9_-]+)(?::([0-9.]+))?$/.exec(String(t||"").trim());return m?{to:m[1],amount:m[2]?+m[2]:0}:null}

  ensureQRGen().then(drawReceiveQR).catch(function(){var b=$("#qrBox");if(b)b.innerHTML='<p class="small err">تعذر تجهيز الرمز. حدّث الصفحة وحاول مرة أخرى.</p>'});

async function submitTransfer(ev){
  ev.preventDefault();var me=myMember();if(!me)return;
  var to=val("tr-to"),amount=r2(numv("tr-amount")),note=val("tr-note").trim(),msg=$("#trMsg"),c=calc(),btn=$("#trSubmit");
  function err(x){showMsg(msg,'<p class="err">'+esc(x)+'</p>');toast(x)}
  var mx=c.members.find(function(y){return y.m.id===me.id}),bal=mx?mx.balance:0;
  if(!to||to===me.id||!S.members.some(function(m){return m.id===to}))return err("اختر المستلم.");
  if(!(amount>0))return err("اكتب مبلغاً أكبر من صفر.");
  if(amount>bal+0.004)return err("رصيدك "+NF.format(bal)+" ج.م، ولا يمكن تحويل أكثر منه.");
  if(!sheetState.confirm){sheetState.confirm=true;showMsg(msg,'<div class="preview"><div class="row"><span class="muted">ستحوّل</span><b>'+money(amount)+' ج.م</b></div><div class="row"><span class="muted">إلى</span><b>'+esc(nameOf(to))+'</b></div><div class="row"><span class="muted">رصيدك بعد التحويل</span><b>'+money(bal-amount)+' ج.م</b></div></div>');btn.textContent="تأكيد التحويل";return}
  btn.disabled=true;btn.textContent="جارٍ التحويل…";
  unlockAudio();var xref=db.collection("tx").doc(),xd={type:"transfer",member:me.id,to:to,amount:amount,date:today(),note:note,by:S.email||null,createdAt:Date.now()};
  var ok=await w(function(){return xref.set(xd)});
  if(ok){closeSheet();showDone({title:"تمّ التحويل",amount:amount,sub:"إلى "+nameOf(to),tx:Object.assign({id:xref.id},xd)})}else{btn.disabled=false;btn.textContent="تأكيد التحويل"}
}
function openScan(){
  sheetState={kind:"scan"};
  openSheet('<h3>امسح رمز المستلم</h3><div class="scanbox"><video id="scanVideo" playsinline muted autoplay></video><div class="scanframe"></div></div><p class="small muted" id="scanMsg" style="margin:0">وجّه الكاميرا إلى الرمز الظاهر على هاتف المستلم.</p><button class="btn ghost block" data-act="transfer">رجوع واختيار المستلم من القائمة</button>');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanFail("الكاميرا غير متاحة هنا. اختر المستلم من القائمة.");return}
  Promise.all([ensureJsQR(),navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})]).then(function(r){
    var stream=r[1];if(sheetState.kind!=="scan"){stream.getTracks().forEach(function(t){t.stop()});return}
    SCAN.stream=stream;var v=$("#scanVideo");v.srcObject=stream;var pl=v.play();if(pl&&pl.catch)pl.catch(function(){});
    var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    (function tick(){if(sheetState.kind!=="scan")return;
      if(v.readyState>=2&&v.videoWidth){var W=Math.min(640,v.videoWidth),H=Math.round(v.videoHeight*W/v.videoWidth);cv.width=W;cv.height=H;cx.drawImage(v,0,0,W,H);var im=cx.getImageData(0,0,W,H),code=window.jsQR(im.data,W,H,{inversionAttempts:"dontInvert"});
        if(code&&code.data){var p=parsePay(code.data);
          if(p){stopScan();if(p.to===myId()){toast("هذا رمز حسابك أنت");return openTransfer()}if(!S.members.some(function(m){return m.id===p.to})){toast("الرمز لا يخص أي حساب في الصندوق");return openTransfer()}return openTransfer(p)}
          var sm=$("#scanMsg");if(sm)sm.textContent="هذا ليس رمز استلام من صندوق العائلة."}}
      SCAN.raf=requestAnimationFrame(tick)})();
  }).catch(function(e){scanFail(e&&e.name==="NotAllowedError"?"لم يُسمح باستعمال الكاميرا. اسمح بها من إعدادات الآيفون، أو اختر المستلم من القائمة.":e&&e.message==="load"?"تعذر تحميل قارئ الرموز. تحقق من الإنترنت، أو اختر المستلم من القائمة.":"تعذر فتح الكاميرا. اختر المستلم من القائمة.")});
}
function scanFail(x){var m=$("#scanMsg");if(m){m.textContent=x;m.className="small err"}}
function stopScan(){cancelAnimationFrame(SCAN.raf);if(SCAN.stream){SCAN.stream.getTracks().forEach(function(t){t.stop()});SCAN.stream=null}}

async function delMember(){
  if(!isAdmin()){toast("الحذف للمدير فقط");return}
  var id=sheetState.id,m=S.members.find(function(x){return x.id===id});if(!m)return closeSheet();
  if(!sheetState.confirm){sheetState.confirm=true;document.querySelector('[data-act="del-member"]').textContent="تأكيد حذف "+m.name;return}
  var deals=S.deals.filter(function(d){return d.member===id}).map(function(d){return d.id});
  var txs=S.tx.filter(function(t){return t.member===id||t.to===id||(t.deal&&deals.indexOf(t.deal)>=0)});
  var ops=[db.doc("members/"+id).delete()];
  txs.forEach(function(t){ops.push(db.doc("tx/"+t.id).delete());if(t.receipt)ops.push(db.doc("receipts/"+t.receipt).delete())});
  deals.forEach(function(d){ops.push(db.doc("deals/"+d).delete())});
  S.dists.forEach(function(d){var al=d.alloc||{};if(al[id]!=null){var na=Object.assign({},al),amt=+na[id]||0;delete na[id];ops.push(db.doc("dists/"+d.id).set(Object.assign({},d,{id:undefined,alloc:na,total:r2((+d.total||0)-amt)})))}});
  if(await w(function(){return Promise.all(ops)})){closeSheet();toast("حُذف "+m.name)}
}

/* ---------- plumbing ---------- */
function writeFailed(e){var c=e&&e.code;
  if(c==="permission-denied"){S.denied=true;S.denyWhat="write";render();window.scrollTo(0,0);toast("Firebase رفض الحفظ، انظر التنبيه أعلى الصفحة")}
  else if(c==="resource-exhausted")toast("تجاوزتم حد الاستخدام المجاني اليومي، حاولوا غداً");
  else toast("تعذر الحفظ: "+(c||"خطأ غير معروف"))}
async function w(fn){
  if(!db){toast("الصندوق غير متصل");return false}
  try{var p=Promise.resolve().then(fn);var res=await Promise.race([p.then(function(){return "ok"}),new Promise(function(r){setTimeout(function(){r("queued")},1500)})]);
    if(res==="ok"&&S.denied){S.denied=false;render()}
    if(res==="queued"){p.then(function(){if(S.denied){S.denied=false;render()}}).catch(writeFailed);if(!navigator.onLine)toast("حُفظ على الجهاز، وسيُرفع عند عودة الإنترنت")}return true}
  catch(e){writeFailed(e);return false}
}
var toastT;function toast(s){var t=$("#toast");t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-tab]");if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="close-scrim"){if(e.target===el)closeSheet();return}
  if(a==="close")return closeSheet();
  if(a==="add")return openAdd(el.dataset.type);
  if(a==="add-type"){sheetState.type=id;return openAdd(id)}
  if(a==="add-member")return openMember();
  if(a==="filter"){S.filter=id;return render()}
  if(a==="open-tx")return openTx(id);
  if(a==="del-tx")return delTx();
  if(a==="open-deal")return openDeal(id);
  if(a==="del-deal")return delDeal();
  if(a==="distribute")return openDistribute();
  if(a==="do-dist")return doDistribute();
  if(a==="undo-dist")return undoDist(id);
  if(a==="add-note")return openNoteAdd(el.dataset.type);
  if(a==="open-note")return openNote(id);
  if(a==="toggle-note")return toggleNote();
  if(a==="del-note")return delNote();
  if(a==="open-member"){if(id===myId()){S.tab="home";render();window.scrollTo(0,0);return}return openMemberSheet(id)}
  if(a==="link-me"){var lm=S.members.find(function(m){return m.id===id});if(!lm||lm.uid){toast("هذا الحساب مربوط مسبقاً");return}
    w(function(){return db.doc("members/"+id).update({uid:S.uid,email:S.email||""})}).then(function(ok){if(ok){S.tab="home";toast("أهلاً "+lm.name+"، هذا حسابك الآن")}});return}
  if(a==="transfer"){stopScan();return openTransfer()}
  if(a==="tilt")return enableTilt();
  if(a==="add-liab")return openAddLiab();
  if(a==="chart-mode"){CHART_MODE=id;try{localStorage.setItem("bot-charts",id)}catch(er){}return render()}
  if(a==="add-motion")return openAddMotion();
  if(a==="vote")return castVote(id,el.dataset.v);
  if(a==="close-motion")return closeMotion(id);
  if(a==="del-motion"){if(!isAdmin())return;if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="تأكيد الحذف";return}w(function(){return db.doc("notes/"+id).delete()}).then(function(ok){if(ok)toast("حُذف القرار")});return}
  if(a==="backup")return backup();
  if(a==="reset-open")return openReset();
  if(a==="liab-kind")return openAddLiab(id);
  if(a==="open-liab")return openLiab(id);
  if(a==="del-liab")return delLiab();
  if(a==="statement")return openStatement();
  if(a==="stmt-month")return openStatement(id);
  if(a==="share-receipt")return shareReceipt();
  if(a==="done-close")return closeDone();
  if(a==="install-hide"){try{localStorage.setItem("bot-install-hide","1")}catch(e){}return render()}
  if(a==="install"){if(DEFERRED_INSTALL){DEFERRED_INSTALL.prompt();DEFERRED_INSTALL=null;render()}return}
  if(a==="receive")return openReceive();
  if(a==="scan"){if(!myMember())return;return openScan()}
  if(a==="browse"){S.browse=true;S.tab="fund";render();return}
  if(a==="my-ledger"){S.filter="mine";S.tab="ledger";render();window.scrollTo(0,0);return}
  if(a==="unlink-member"){if(!isAdmin())return;var um=sheetState.id;w(function(){return db.doc("members/"+um).update({uid:null,email:null})}).then(function(ok){if(ok){closeSheet();toast("فُكّ ربط الحساب")}});return}
  if(a==="del-member")return delMember();
  if(a==="claim-admin"){if(S.settings&&S.settings.adminUid){toast("المدير محدد مسبقاً");return}w(function(){return db.doc("members/__settings").set({kind:"settings",adminUid:S.uid,adminEmail:S.email||"",createdAt:Date.now()})}).then(function(ok){if(ok)toast("أصبحت مدير الصندوق")});return}
  if(a==="retry"){S.denied=false;startData();render();toast("جارٍ إعادة الاتصال…");return}
  if(a==="seed-members"){if(S.members.length){toast("الأعضاء موجودون مسبقاً");return}var sb=$("#seedBtn");if(sb){sb.disabled=true;sb.textContent="جارٍ الإضافة…"}
    w(function(){return Promise.all(["إبراهيم","مريم","زينب"].map(function(n,i){return db.collection("members").add({name:n,order:i+1,createdAt:Date.now()})}))}).then(function(ok){if(ok)toast("أُضيف الأعضاء الثلاثة");else if(sb){sb.disabled=false;sb.textContent="إضافة إبراهيم ومريم وزينب"}});return}
  if(a==="logout"){closeSheet();stopData();signOut(AUTH);return}
  if(a==="reset-pass"){var em=val("l-email").trim();if(!em){showMsg($("#loginMsg"),'<p class="err">اكتب بريدك أولاً.</p>');return}sendPasswordResetEmail(AUTH,em).then(function(){toast("أُرسل رابط تغيير كلمة المرور إلى بريدك")}).catch(function(){toast("تعذر الإرسال، تحقق من البريد")});return}
});
document.addEventListener("submit",function(e){
  var id=e.target.id;
  if(id==="addForm")return submitAdd(e);
  if(id==="payForm")return submitPay(e);
  if(id==="memForm")return submitMember(e);
  if(id==="noteForm")return submitNote(e);
  if(id==="goalForm")return submitGoal(e);
  if(id==="trForm")return submitTransfer(e);
  if(id==="liabForm")return submitLiab(e);
  if(id==="motionForm")return submitMotion(e);
  if(id==="resetForm")return submitReset(e);
  if(id==="liabPayForm")return submitLiabPay(e);
  if(id==="loginForm"){e.preventDefault();var b=$("#loginBtn");b.disabled=true;b.textContent="جارٍ الدخول…";
    signInWithEmailAndPassword(AUTH,val("l-email").trim(),val("l-pass")).catch(function(er){var c=er&&er.code;b.disabled=false;b.textContent="دخول";
      showMsg($("#loginMsg"),'<p class="err">'+(c==="auth/network-request-failed"?"لا يوجد اتصال بالإنترنت.":c==="auth/too-many-requests"?"محاولات كثيرة، انتظر قليلاً ثم حاول.":"البريد أو كلمة المرور غير صحيحين.")+'</p>')});}
});
document.addEventListener("input",function(e){
  if(sheetState.kind==="add"){if(sheetState.ack){sheetState.ack=false;var b=$("#addSubmit");if(b)b.textContent="حفظ";var m=$("#addMsg");if(m)m.innerHTML=""}updateMPrev()}
  if(sheetState.kind==="deal")mudPreview();
  if(sheetState.kind==="receive"&&e.target.id==="rc-amount")drawReceiveQR();
  if(sheetState.kind==="transfer"&&sheetState.confirm){sheetState.confirm=false;var tb=$("#trSubmit");if(tb)tb.textContent="متابعة";var tm=$("#trMsg");if(tm)tm.innerHTML=""}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
document.addEventListener("pointermove",chartHover);document.addEventListener("pointerdown",chartHover);document.addEventListener("pointerleave",chartLeave,true);

var AUTH=null,FS=null,UNSUBS=[];
function startData(){
  stopData();
  db={collection:function(name){var col=collection(FS,name);return {
      add:function(d){return addDoc(col,clean(d))},
      doc:function(id){return wrapRef(id?doc(FS,name,id):doc(col))},
      onSnapshot:function(next,err){return onSnapshot(col,function(sn){next({docs:sn.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})})},err)}}},
    doc:function(path){var p=path.split("/");return wrapRef(doc(FS,p[0],p[1]))}};
  COLS.forEach(function(name){
    UNSUBS.push(db.collection(name).onSnapshot(function(snap){var all=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      if(name==="members"){S.settings=all.find(function(x){return x.id==="__settings"})||null;all=all.filter(function(x){return x.id!=="__settings"})}
      if(name==="tx"){var mi=myId();if(S.loaded.tx&&mi)all.forEach(function(t){if(t.type==="transfer"&&t.to===mi&&!S.seenTx[t.id]&&(t.createdAt||0)>S.bootAt)toast("وصلك "+NF.format(t.amount)+" ج.م من "+nameOf(t.member))});all.forEach(function(t){S.seenTx[t.id]=1})}
      S[name]=all;S.loaded[name]=true;render()},
      function(err){S.loaded[name]=true;render();if(err&&err.code==="permission-denied"){S.denied=true;S.denyWhat="read";render()}}));
  });
}
function stopData(){UNSUBS.forEach(function(u){try{u()}catch(e){}});UNSUBS=[];COLS.forEach(function(c){S[c]=[];S.loaded[c]=false})}
function wrapRef(ref){return {id:ref.id,set:function(d){return setDoc(ref,clean(d))},update:function(d){return updateDoc(ref,clean(d))},delete:function(){return deleteDoc(ref)}}}
function clean(d){return JSON.parse(JSON.stringify(d))}

render();
if(!firebaseConfig||!firebaseConfig.apiKey||/PUT_|ضع/.test(firebaseConfig.apiKey)){S.setup=true;render()}
else{
  var app=initializeApp(firebaseConfig);AUTH=getAuth(app);
  try{FS=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){FS=initializeFirestore(app,{})}
  onAuthStateChanged(AUTH,function(u){if(u){S.authed=true;S.writable=true;S.uid=u.uid;S.email=u.email;startData()}else{S.authed=false;S.email=null;stopData()}render()});
}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
