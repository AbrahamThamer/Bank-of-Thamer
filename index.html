<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صندوق العائلة</title>
<meta name="theme-color" content="#1C5A47" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="صندوق العائلة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a pocket ledger — one column, bottom tab bar, sheets that slide up for every entry */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --sunk:#E1E8E4; --line:#CFD9D4;
  --ink:#13201C; --muted:#56655F; --pine:#1C5A47; --pine-soft:#D5E6DE; --on-pine:#FFFFFF;
  --brass:#946C1E; --good:#1F7444; --bad:#AE3626; --warn:#9A620E; --warn-soft:#F6EBD6;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#eda100; --m5:#e87ba4; --cash:#eb6834;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2B3A35;
  --ink:#E4ECE8; --muted:#94A69F; --pine:#5DB393; --pine-soft:#1E3A31; --on-pine:#0B1311;
  --brass:#D7AE5E; --good:#5CC48A; --bad:#EE7A68; --warn:#E3A84A; --warn-soft:#3A2E17;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --cash:#d95926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2B3A35;
  --ink:#E4ECE8; --muted:#94A69F; --pine:#5DB393; --pine-soft:#1E3A31; --on-pine:#0B1311;
  --brass:#D7AE5E; --good:#5CC48A; --bad:#EE7A68; --warn:#E3A84A; --warn-soft:#3A2E17;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --cash:#d95926; color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0;margin:0;color:var(--ink)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.chip-link{font-size:13px;color:var(--pine);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:999px;background:var(--surface)}

h2.sec{font-family:var(--f-display);font-weight:500;font-size:17px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec .aside{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}

.ledger-head{background:var(--pine);color:var(--on-pine);border-radius:20px;padding:20px 18px 16px;display:grid;gap:14px}
.ledger-head .lbl{font-size:13px;opacity:.85}
.ledger-head .big{font-size:38px;font-weight:700;line-height:1.1}
.ledger-head .big .cur{font-size:16px;font-weight:500;opacity:.85;margin-inline-start:6px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid color-mix(in srgb,var(--on-pine) 25%,transparent);padding-top:12px}
.trio div{min-width:0}
.trio .v{font-weight:600;font-size:16px}
.trio .k{font-size:12px;opacity:.8}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stack{display:grid;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.meter>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--pine)}
.meter.warn>i{background:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

.shares{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.shares span{display:block;height:100%}
.member{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%}
.member .nm{font-weight:600}
.member .sub{font-size:12px;color:var(--muted)}
.member .bal{text-align:end}
.member .bal b{font-size:16px}

.callout{border-radius:var(--r);padding:14px 16px;background:var(--warn-soft);color:var(--ink);display:grid;gap:10px}
.callout.ok{background:var(--pine-soft)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check .eq{font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.good{background:var(--pine-soft);color:var(--good)}
.badge.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--pine);color:var(--on-pine);min-height:46px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:none;border-inline:0;border-top:0}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .d{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.item .a{font-weight:700;text-align:end;align-self:center;grid-row:span 2}
.plus{color:var(--good)} .minus{color:var(--bad)}
.item .prog{grid-column:1/-1;margin-top:6px}
.item.closed{opacity:.6}
.clip{display:inline-block;margin-inline-start:6px;font-size:11px;color:var(--brass);font-weight:600}
.group-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:14px 4px 6px}

.empty{text-align:center;padding:28px 18px;display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{margin:0;color:var(--muted);max-width:34ch}

nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted);min-height:56px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pine);font-weight:600}
.tab.add{justify-self:center;width:100%}
.tab.add span.fab{width:46px;height:46px;border-radius:16px;background:var(--pine);color:var(--on-pine);display:grid;place-items:center;margin-top:-6px}
.tab.add svg{stroke-width:2.4}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);justify-self:center;margin-top:4px}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.warnbox ul{margin:0;padding-inline-start:18px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.receipt{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}


.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;line-height:1.3}
.kpi .s{font-size:12px;color:var(--muted)}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:2}
.tbl{margin-top:6px;font-size:13px}
.tbl summary{color:var(--pine);cursor:pointer;padding:4px 0}
.tbl .wrap{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.hbar{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbar .track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:0 4px 4px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert:last-child{border-bottom:0}
#toast{position:fixed;z-index:60;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <h1 class="brand">صندوق العائلة<small id="sub">دفتر مشترك بلا ربا</small></h1>
    <button class="chip-link" data-act="logout" id="logoutBtn" hidden>خروج</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="nav" hidden dir="rtl" aria-label="الأقسام"><div class="in">
  <button class="tab" data-tab="home" id="t-home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button class="tab" data-tab="ledger" id="t-ledger"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>العمليات</button>
  <button class="tab add" data-act="add" id="t-add" aria-label="عملية جديدة"><span class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button class="tab" data-tab="deals" id="t-deals"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2M4 12h16"/></svg>العقود</button>
  <button class="tab" data-tab="stats" id="t-stats"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 15l4-5 4 3 5-7"/></svg>الإحصاء</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
(function(){
"use strict";
var S={members:[],tx:[],deals:[],dists:[],notes:[],loaded:{},tab:"home",filter:"all",noDb:false,writable:true,uid:null,email:null,authed:null,setup:false,denied:false,denyWhat:"",settings:null};
function isAdmin(){return !!(S.settings&&S.uid&&S.settings.adminUid===S.uid)}
var db=null;
var COLS=["members","tx","deals","dists","notes"];
var TX={deposit:{l:"إيداع",s:1},withdraw:{l:"سحب",s:-1},qard_out:{l:"قرض حسن",s:-1},qard_in:{l:"سداد قرض",s:1},murabaha_buy:{l:"شراء مرابحة",s:-1},murabaha_pay:{l:"قسط مرابحة",s:1},mudaraba_out:{l:"تمويل مضاربة",s:-1},mudaraba_close:{l:"إغلاق مضاربة",s:1}};
var KIND={qard:"قرض حسن",murabaha:"مرابحة",mudaraba:"مضاربة"};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function r2(n){return Math.round((+n+Number.EPSILON)*100)/100}
var NF=new Intl.NumberFormat("en-US",{maximumFractionDigits:2});
function money(n){return '<span class="num">'+NF.format(r2(n))+'</span>'}
function pct(n){return '<span class="num">'+(Math.round(n*1000)/10)+'٪</span>'}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s||""}}
function nameOf(id){var m=S.members.find(function(x){return x.id===id});return m?m.name:"—"}
function colorOf(id){var ms=sortedMembers();var i=ms.findIndex(function(x){return x.id===id});return "var(--m"+((i<0?0:i)%5+1)+")"}
function sortedMembers(){return S.members.slice().sort(function(a,b){return (a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name)})}
function loaded(){return COLS.every(function(c){return S.loaded[c]})}
function accountDay(){var now=new Date();now.setHours(0,0,0,0);for(var k=0;k<3;k++){var d=new Date(now.getFullYear(),now.getMonth()+k,1);while(d.getDay()!==5)d.setDate(d.getDate()+1);if(d>=now)return d}return now}
function isAccountDay(){var d=accountDay(),n=new Date();n.setHours(0,0,0,0);return d.getTime()===n.getTime()}
function cashOf(t){return t.type==="mudaraba_close"?(+t.cashIn||0):TX[t.type]?TX[t.type].s*(+t.amount||0):0}

function dealStat(d){
  var txs=S.tx.filter(function(t){return t.deal===d.id});
  var o={d:d,txs:txs,open:true,outCost:0,paid:0,total:0,remaining:0,progress:0};
  if(d.kind==="qard"){o.total=+d.amount;o.paid=txs.filter(function(t){return t.type==="qard_in"}).reduce(function(s,t){return s+(+t.amount)},0);o.remaining=r2(o.total-o.paid);o.outCost=Math.max(0,o.remaining)}
  else if(d.kind==="murabaha"){o.total=+d.price;o.paid=txs.filter(function(t){return t.type==="murabaha_pay"}).reduce(function(s,t){return s+(+t.amount)},0);o.remaining=r2(o.total-o.paid);o.outCost=d.price>0?Math.max(0,o.remaining)*d.cost/d.price:0}
  else if(d.kind==="mudaraba"){var cl=txs.find(function(t){return t.type==="mudaraba_close"});o.total=+d.capital;o.closeTx=cl||null;o.remaining=cl?0:o.total;o.paid=cl?o.total:0;o.outCost=cl?0:o.total}
  o.open=o.remaining>0.004;o.progress=o.total>0?Math.min(1,o.paid/o.total):0;return o;
}
function calc(){
  var bal={};S.members.forEach(function(m){bal[m.id]={dep:0,wd:0,dist:0}});
  var cash=0,profit=0;
  S.tx.forEach(function(t){cash+=cashOf(t);profit+=(+t.profit||0);if(bal[t.member]){if(t.type==="deposit")bal[t.member].dep+=(+t.amount);if(t.type==="withdraw")bal[t.member].wd+=(+t.amount)}});
  var distributed=0;S.dists.forEach(function(d){distributed+=(+d.total||0);var a=d.alloc||{};Object.keys(a).forEach(function(k){if(bal[k])bal[k].dist+=(+a[k])})});
  var deals=S.deals.map(dealStat);
  var recv=deals.reduce(function(s,o){return s+o.outCost},0);
  var members=sortedMembers().map(function(m){var b=bal[m.id];return {m:m,balance:r2(b.dep-b.wd+b.dist),dist:r2(b.dist)}});
  var sumBal=members.reduce(function(s,x){return s+x.balance},0);
  members.forEach(function(x){x.share=sumBal>0?x.balance/sumBal:0});
  var undist=r2(profit-distributed);
  var equity=r2(sumBal+undist),assets=r2(cash+recv);
  return {cash:r2(cash),recv:r2(recv),profit:r2(profit),distributed:r2(distributed),undist:undist,equity:equity,assets:assets,sumBal:r2(sumBal),members:members,deals:deals,diff:r2(assets-equity)};
}

/* ---------- statistics ---------- */
var CH={};
var CF=new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:1});
function niceStep(x){if(!(x>0))return 1;var p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function yRange(vals){var lo=Math.min(0,Math.min.apply(null,vals)),hi=Math.max(0,Math.max.apply(null,vals));var st=niceStep((hi-lo)/4||1);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;var t=[];for(var v=lo;v<=hi+st/2;v+=st)t.push(r2(v));return {lo:lo,hi:hi,ticks:t}}
function shortDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short"})}catch(e){return s}}
function monthLabel(m){try{return new Date(m+"-15T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{month:"short",year:"2-digit"})}catch(e){return m}}

function equitySeries(){
  var tx=S.tx.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))||(a.createdAt||0)-(b.createdAt||0)});
  var map={},eq=0,cash=0;
  tx.forEach(function(t){cash+=cashOf(t);if(t.type==="deposit")eq+=(+t.amount);if(t.type==="withdraw")eq-=(+t.amount);eq+=(+t.profit||0);map[t.date]={eq:r2(eq),cash:r2(cash)}});
  return Object.keys(map).sort().map(function(d){return {key:d,label:shortDate(d),x:Date.parse(d+"T12:00:00"),v:map[d]}});
}
function monthlyProfit(){
  var by={};S.tx.forEach(function(t){if(t.profit){var m=String(t.date).slice(0,7);by[m]=(by[m]||0)+(+t.profit)}});
  var first=S.tx.reduce(function(m,t){var k=String(t.date).slice(0,7);return !m||k<m?k:m},null);if(!first)return [];
  var now=today().slice(0,7),out=[],y=+first.slice(0,4),mo=+first.slice(5,7);
  while(true){var k=y+"-"+String(mo).padStart(2,"0");out.push({key:k,label:monthLabel(k),v:{p:r2(by[k]||0)}});if(k>=now||out.length>36)break;mo++;if(mo>12){mo=1;y++}}
  return out.slice(-12);
}
function lateItems(c){
  var out=[],td=today(),now=new Date();
  c.deals.forEach(function(o){var d=o.d;if(!o.open)return;
    if(d.kind==="qard"&&d.due&&d.due<td)out.push({who:d.member,txt:"قرض حسن تجاوز موعد رده ("+fdate(d.due)+")، والباقي "+NF.format(o.remaining)+" ج.م"});
    if(d.kind==="murabaha"){var st=new Date(d.date+"T12:00:00");var m=(now.getFullYear()-st.getFullYear())*12+(now.getMonth()-st.getMonth())-(now.getDate()<st.getDate()?1:0);var exp=Math.min(d.price,Math.max(0,m)*d.price/d.installments);if(o.paid+0.01<exp)out.push({who:d.member,txt:"أقساط «"+(d.item||"مرابحة")+"» متأخرة بمقدار "+NF.format(r2(exp-o.paid))+" ج.م"})}
  });return out;
}

function lineChart(id,pts,keys){
  var W=340,H=190,L=44,R=12,T=12,B=26;
  var vals=[];pts.forEach(function(p){keys.forEach(function(k){vals.push(p.v[k.k])})});
  var yr=yRange(vals),x0=pts[0].x,x1=pts[pts.length-1].x;if(x0===x1){x0-=86400000*3;x1+=86400000*3}
  function X(x){return L+(x-x0)/(x1-x0)*(W-L-R)}function Y(v){return T+(yr.hi-v)/(yr.hi-yr.lo)*(H-T-B)}
  var g=yr.ticks.map(function(t){return '<line class="'+(t===0?"base":"grid")+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+CF.format(t)+'</text>'}).join("");
  var xl=[pts[0]];if(pts.length>2)xl.push(pts[Math.floor((pts.length-1)/2)]);if(pts.length>1)xl.push(pts[pts.length-1]);
  g+=xl.map(function(p,i){return '<text class="ax" x="'+X(p.x)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===xl.length-1?"end":"middle")+'">'+esc(p.label)+'</text>'}).join("");
  var marks=keys.map(function(k,ki){var d=pts.map(function(p,i){return (i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.v[k.k]).toFixed(1)}).join(" ");
    var area=ki===0&&pts.length>1?'<path d="'+d+" L"+X(pts[pts.length-1].x).toFixed(1)+" "+Y(Math.max(0,yr.lo))+" L"+X(pts[0].x).toFixed(1)+" "+Y(Math.max(0,yr.lo))+' Z" fill="'+k.c+'" fill-opacity=".12" stroke="none"/>':"";
    var last=pts[pts.length-1];
    return area+(pts.length>1?'<path d="'+d+'" fill="none" stroke="'+k.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':"")+'<circle cx="'+X(last.x)+'" cy="'+Y(last.v[k.k])+'" r="4" fill="'+k.c+'" stroke="var(--surface)" stroke-width="2"/>'}).join("");
  CH[id]={type:"line",pts:pts,keys:keys,W:W,H:H,X:X,Y:Y,T:T,B:B,xs:pts.map(function(p){return X(p.x)})};
  return chartWrap(id,keys,'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(keys.map(function(k){return k.l}).join(" و "))+'">'+g+marks+'<g class="hov"></g></svg>',pts);
}
function barChart(id,pts,key){
  var W=340,H=170,L=44,R=12,T=12,B=26;
  var yr=yRange(pts.map(function(p){return p.v[key.k]}));var band=(W-L-R)/pts.length,bw=Math.min(28,band*0.6);
  function Y(v){return T+(yr.hi-v)/(yr.hi-yr.lo)*(H-T-B)}function CX(i){return L+band*i+band/2}
  var g=yr.ticks.map(function(t){return '<line class="'+(t===0?"base":"grid")+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+CF.format(t)+'</text>'}).join("");
  var every=Math.ceil(pts.length/6);
  g+=pts.map(function(p,i){return i%every===0||i===pts.length-1?'<text class="ax" x="'+CX(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.label)+'</text>':""}).join("");
  var bars=pts.map(function(p,i){var v=p.v[key.k];if(!v)return "";var y0=Y(0),y1=Y(v),top=Math.min(y0,y1),h=Math.max(1,Math.abs(y1-y0));return '<rect x="'+(CX(i)-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+key.c+'"/>'}).join("");
  CH[id]={type:"bar",pts:pts,keys:[key],W:W,H:H,T:T,B:B,xs:pts.map(function(p,i){return CX(i)}),Y:Y};
  return chartWrap(id,null,'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(key.l)+'">'+g+bars+'<g class="hov"></g></svg>',pts,[key]);
}
function chartWrap(id,legendKeys,svg,pts,tableKeys){
  var keys=legendKeys||tableKeys;
  var leg=legendKeys&&legendKeys.length>1?'<div class="legend">'+legendKeys.map(function(k){return '<span><i style="background:'+k.c+'"></i>'+esc(k.l)+'</span>'}).join("")+'</div>':"";
  var tbl='<details class="tbl"><summary>عرض الأرقام</summary><div class="wrap"><table><thead><tr><th>التاريخ</th>'+keys.map(function(k){return "<th>"+esc(k.l)+"</th>"}).join("")+'</tr></thead><tbody>'+pts.slice().reverse().map(function(p){return "<tr><td>"+esc(p.label)+"</td>"+keys.map(function(k){return "<td>"+NF.format(p.v[k.k])+"</td>"}).join("")+"</tr>"}).join("")+'</tbody></table></div></details>';

function warnsFor(t,amount,member,c){
  var w=[];var after=c.cash-(t==="deposit"?-amount:amount);
  if(t!=="deposit"&&after<c.equity*0.2-0.004)w.push("سيبقى في الصندوق نقد أقل من الاحتياطي (20٪ = "+NF.format(r2(c.equity*0.2))+").");
  if((t==="murabaha"||t==="mudaraba")&&amount>c.equity*0.4+0.004)w.push("المبلغ يتجاوز 40٪ من الصندوق، وهو حد العملية الواحدة في الميثاق.");
  if(t==="qard"){var outQ=c.deals.filter(function(o){return o.d.kind==="qard"&&o.open&&o.d.member===member}).reduce(function(s,o){return s+o.remaining},0);if(outQ+amount>c.equity*0.1+0.004)w.push("القروض الحسنة لهذا العضو ستتجاوز 10٪ من الصندوق.")}
  if(t==="murabaha"&&c.deals.some(function(o){return o.d.kind==="murabaha"&&o.open&&o.d.member===member}))w.push("لهذا العضو مرابحة لم تكتمل بعد، والميثاق يسمح بواحدة نشطة.");
  if((t==="deposit"||t==="withdraw")&&!isAccountDay()&&S.tx.some(function(x){return x.type==="deposit"}))w.push("الميثاق يجعل الإيداع والسحب في يوم الحساب، بعد توزيع الأرباح.");
  return w;
}
async function submitAdd(ev){
  ev.preventDefault();
  var t=sheetState.type,c=calc(),member=val("f-member"),amount=r2(numv("f-amount")),date=val("f-date")||today(),note=val("f-note").trim();
  var msg=$("#addMsg");function err(s){showMsg(msg,'<p class="err">'+esc(s)+'</p>');toast(s)}
  if(!member)return err("اختر العضو.");
  if(!(amount>0))return err("اكتب مبلغاً أكبر من صفر.");
  if(t!=="deposit"&&amount>c.cash+0.004)return err("النقد المتاح في الصندوق "+NF.format(c.cash)+" ج.م فقط، وهو لا يكفي لهذه العملية.");
  if(t==="withdraw"){var mb=c.members.find(function(x){return x.m.id===member});if(!mb||amount>mb.balance+0.004)return err("رصيد "+nameOf(member)+" "+NF.format(mb?mb.balance:0)+" ج.م، ولا يمكن سحب أكثر منه.")}
  if((t==="murabaha"||t==="mudaraba")&&!val("f-item").trim())return err(t==="murabaha"?"اكتب اسم الغرض.":"اكتب اسم المشروع.");
  if(!sheetState.ack){var wl=warnsFor(t,amount,member,c);if(wl.length){sheetState.ack=true;showMsg(msg,'<div class="warnbox"><b>تنبيه من الميثاق</b><ul>'+wl.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul><span>اضغط «حفظ رغم ذلك» إن اتفقتم على هذا.</span></div>');$("#addSubmit").textContent="حفظ رغم ذلك";return}}
  var btn=$("#addSubmit");btn.disabled=true;btn.textContent="جارٍ الحفظ…";
  var receipt=await uploadReceipt("f-receipt");if(receipt===false){btn.disabled=false;btn.textContent="حفظ";return}
  var base={amount:amount,date:date,member:member,note:note,by:S.email||null,createdAt:Date.now()};if(receipt)base.receipt=receipt;
  var ok=await w(async function(){
    if(t==="deposit"||t==="withdraw"){await db.collection("tx").add(Object.assign({type:t},base))}
    else{
      var dref=db.collection("deals").doc(),deal={kind:t,member:member,date:date,note:note,createdAt:Date.now()};
      if(t==="qard"){deal.amount=amount;deal.due=val("f-due")||""}
      if(t==="murabaha"){var mk=numv("f-markup"),n=Math.max(1,Math.round(numv("f-inst")||1));deal.item=val("f-item").trim();deal.cost=amount;deal.markup=mk;deal.price=r2(amount*(1+mk/100));deal.installments=n}
      if(t==="mudaraba"){deal.item=val("f-item").trim();deal.capital=amount;deal.workerShare=Math.min(100,Math.max(0,numv("f-worker")))/100}
      await Promise.all([dref.set(deal),db.collection("tx").add(Object.assign({type:t==="qard"?"qard_out":t==="murabaha"?"murabaha_buy":"mudaraba_out",deal:dref.id},base,deal.item?{note:note||deal.item}:{}))]);
    }
  });
  if(ok){closeSheet();toast("حُفظت العملية")}else{btn.disabled=false;btn.textContent="حفظ"}
}
async function uploadReceipt(id){
  var inp=document.getElementById(id);if(!inp||!inp.files||!inp.files[0])return null;
  try{var data=await compressImage(inp.files[0]);var ref=doc(collection(FS,"receipts"));setDoc(ref,{data:data,createdAt:Date.now(),by:S.email||null}).catch(writeFailed);return ref.id}
  catch(e){toast("تعذر قراءة الصورة، جرّب صورة أخرى أو احفظ بدونها");return false}
}
function compressImage(file){return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();img.onload=function(){try{var max=1400,sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);var q=.72,out=cv.toDataURL("image/jpeg",q);while(out.length>900000&&q>.3){q-=.12;out=cv.toDataURL("image/jpeg",q)}URL.revokeObjectURL(url);if(out.length>1000000)return rej(new Error("big"));res(out)}catch(e){rej(e)}};img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}

  if(d.kind==="mudaraba")h+='<dt>رأس المال</dt><dd>'+money(d.capital)+'</dd><dt>نصيب العامل</dt><dd>'+pct(d.workerShare)+' من الربح</dd>'+(o.closeTx?'<dt>حصيلة البيع</dt><dd>'+money(o.closeTx.amount)+'</dd><dt>ربح المشروع</dt><dd>'+money(o.closeTx.projectProfit||0)+'</dd>':'');
  h+='</dl><div class="meter"><i style="width:'+(o.progress*100)+'%"></i></div>';
  if(o.txs.length>1)h+='<div class="list">'+o.txs.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0)}).map(txRow).join("")+'</div>';
  if(S.writable&&o.open){
    if(d.kind==="mudaraba"){h+='<form id="payForm" class="stack"><div class="field"><label for="p-amount">حصيلة البيع كاملة</label><input id="p-amount" type="text" inputmode="decimal" autocomplete="off" step="0.01" min="0"></div><div class="preview" id="pPrev"><span class="muted">اكتب الحصيلة لترى القسمة.</span></div>'}
    else{var def=d.kind==="murabaha"?Math.min(o.remaining,r2(d.price/d.installments)):o.remaining;h+='<form id="payForm" class="stack"><div class="field"><label for="p-amount">'+(d.kind==="murabaha"?"مبلغ القسط":"المبلغ المردود")+'</label><input id="p-amount" type="text" inputmode="decimal" autocomplete="off" step="0.01" min="0" value="'+r2(def)+'"></div>'}
    h+='<div class="field"><label for="p-date">التاريخ</label><input id="p-date" type="date" value="'+today()+'"></div>'+receiptField("p-receipt")+'<div id="payMsg"></div><button type="submit" class="btn block" id="paySubmit">'+(d.kind==="mudaraba"?"إغلاق المشروع وتسجيل الحصيلة":d.kind==="murabaha"?"تسجيل القسط":"تسجيل السداد")+'</button></form>';
  }
  h+=S.writable?'<div class="btns"><button class="btn danger" data-act="del-deal">حذف العقد</button><button class="btn ghost" data-act="close">إغلاق</button></div>':'<button class="btn ghost block" data-act="close">إغلاق</button>';
  openSheet(h);
}
function mudPreview(){var p=$("#pPrev");if(!p)return;var d=S.deals.find(function(x){return x.id===sheetState.id});var pr=numv("p-amount");if(!(pr>0)){p.innerHTML='<span class="muted">اكتب الحصيلة لترى القسمة.</span>';return}var x=mudSplit(d,pr);
  p.innerHTML=x.profit>=0?'<div class="row"><span class="muted">ربح المشروع</span><b>'+money(x.profit)+'</b></div><div class="row"><span class="muted">للعامل '+esc(nameOf(d.member))+'</span><b>'+money(x.worker)+'</b></div><div class="row"><span class="muted">للصندوق</span><b>'+money(x.fund)+'</b></div><div class="row"><span class="muted">يدخل الصندوق نقداً</span><b>'+money(x.cashIn)+'</b></div>':'<div class="row"><span class="muted">خسارة المشروع</span><b class="minus">'+money(-x.profit)+'</b></div><div class="small muted">بلا تقصير يتحمّلها الصندوق، ويخسر العامل جهده. ويدخل الصندوق '+money(x.cashIn)+'.</div>'}
function mudSplit(d,proceeds){var profit=r2(proceeds-d.capital);if(profit>=0){var worker=r2(profit*d.workerShare),fund=r2(profit-worker);return {profit:profit,worker:worker,fund:fund,cashIn:r2(d.capital+fund)}}return {profit:profit,worker:0,fund:profit,cashIn:r2(proceeds)}}
async function submitPay(ev){
  ev.preventDefault();var d=S.deals.find(function(x){return x.id===sheetState.id});if(!d)return;var o=dealStat(d);
  var amount=r2(numv("p-amount")),date=val("p-date")||today(),msg=$("#payMsg");function err(s){showMsg(msg,'<p class="err">'+esc(s)+'</p>');toast(s)}
  if(!(amount>=0)||(d.kind!=="mudaraba"&&!(amount>0)))return err("اكتب مبلغاً صحيحاً.");
  if(d.kind!=="mudaraba"&&amount>o.remaining+0.004)return err("الباقي "+NF.format(o.remaining)+" ج.م فقط.");
  var btn=$("#paySubmit");btn.disabled=true;
  var receipt=await uploadReceipt("p-receipt");if(receipt===false){btn.disabled=false;return}
  var t={deal:d.id,member:d.member,amount:amount,date:date,note:d.item||"",by:S.email||null,createdAt:Date.now()};if(receipt)t.receipt=receipt;
  if(d.kind==="qard")t.type="qard_in";
  if(d.kind==="murabaha"){t.type="murabaha_pay";t.profit=r2(amount*(d.price-d.cost)/d.price)}
  if(d.kind==="mudaraba"){var x=mudSplit(d,amount);t.type="mudaraba_close";t.cashIn=x.cashIn;t.profit=x.fund;t.workerProfit=x.worker;t.projectProfit=x.profit}
  var ok=await w(function(){return db.collection("tx").add(t)});
  if(ok){closeSheet();toast(d.kind==="mudaraba"?"أُغلق المشروع":"سُجّل السداد")}else btn.disabled=false;
}
async function delDeal(){
  if(!sheetState.confirm){sheetState.confirm=true;var b=document.querySelector('[data-act="del-deal"]');b.textContent="تأكيد حذف العقد وكل عملياته";return}
  var id=sheetState.id;var ok=await w(async function(){var rel=S.tx.filter(function(x){return x.deal===id});await Promise.all(rel.map(function(x){return db.doc("tx/"+x.id).delete()}).concat([db.doc("deals/"+id).delete()]))});
  if(ok){closeSheet();toast("حُذف العقد")}
}

function openMemberSheet(id){
  var c=calc(),x=c.members.find(function(y){return y.m.id===id});if(!x)return;sheetState={kind:"member-view",id:id,confirm:false};
  var txs=sortedTx().filter(function(t){return t.member===id});
  var h='<h3>'+esc(x.m.name)+'</h3><dl class="kv"><dt>الرصيد</dt><dd><b>'+money(x.balance)+' ج.م</b></dd><dt>الحصة</dt><dd>'+pct(x.share)+'</dd><dt>أرباح موزعة</dt><dd>'+money(x.dist)+'</dd><dt>العمليات</dt><dd><span class="num">'+txs.length+'</span></dd></dl>';
  if(txs.length)h+='<div class="list">'+txs.slice(0,8).map(txRow).join("")+'</div>';
  if(isAdmin())h+='<div id="mdelMsg" class="small muted">حذف العضو يحذف معه كل عملياته وعقوده نهائياً، ولا يمكن التراجع.</div><div class="btns"><button class="btn danger" data-act="del-member">حذف العضو نهائياً</button><button class="btn ghost" data-act="close">إغلاق</button></div>';
  else h+='<button class="btn ghost block" data-act="close">إغلاق</button>';
  openSheet(h);
}
async function delMember(){
  if(!isAdmin()){toast("الحذف للمدير فقط");return}
  var id=sheetState.id,m=S.members.find(function(x){return x.id===id});if(!m)return closeSheet();
  if(!sheetState.confirm){sheetState.confirm=true;document.querySelector('[data-act="del-member"]').textContent="تأكيد حذف "+m.name;return}
  var deals=S.deals.filter(function(d){return d.member===id}).map(function(d){return d.id});
  var txs=S.tx.filter(function(t){return t.member===id||(t.deal&&deals.indexOf(t.deal)>=0)});
  var ops=[db.doc("members/"+id).delete()];
  txs.forEach(function(t){ops.push(db.doc("tx/"+t.id).delete());if(t.receipt)ops.push(db.doc("receipts/"+t.receipt).delete())});
  deals.forEach(function(d){ops.push(db.doc("deals/"+d).delete())});
  S.dists.forEach(function(d){var al=d.alloc||{};if(al[id]!=null){var na=Object.assign({},al),amt=+na[id]||0;delete na[id];ops.push(db.doc("dists/"+d.id).set(Object.assign({},d,{id:undefined,alloc:na,total:r2((+d.total||0)-amt)})))}});
  if(await w(function(){return Promise.all(ops)})){closeSheet();toast("حُذف "+m.name)}
}
function openMember(){
  if(!S.writable){toast("لديك صلاحية القراءة فقط");return}
  sheetState={kind:"member"};
  openSheet('<h3>عضو جديد</h3><form id="memForm" class="stack"><div class="field"><label for="m-name">الاسم</label><input id="m-name" type="text" autocomplete="off"></div><div id="memMsg"></div><div class="btns"><button type="submit" class="btn">إضافة</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>');
}
async function submitMember(ev){ev.preventDefault();var n=val("m-name").trim();if(!n){$("#memMsg").innerHTML='<p class="err">اكتب الاسم.</p>';return}
  var order=S.members.reduce(function(m,x){return Math.max(m,x.order||0)},0)+1;
  if(await w(function(){return db.collection("members").add({name:n,order:order,createdAt:Date.now()})})){closeSheet();toast("أُضيف "+n)}}

function openDistribute(){
  var c=calc();if(c.sumBal<=0){toast("لا أرصدة لتوزيع الربح عليها");return}
  sheetState={kind:"dist"};var al=allocate(c);
  openSheet('<h3>توزيع '+money(c.undist)+' ج.م</h3><p class="small muted" style="margin:0">يُقسم الربح المحقق بحسب حصص الأعضاء الآن، ويُضاف إلى أرصدتهم.</p><div class="list">'+c.members.map(function(x){return '<div class="item"><div class="t">'+esc(x.m.name)+'</div><div class="a">'+money(al[x.m.id]||0)+'</div><div class="d">حصته '+pct(x.share)+'</div></div>'}).join("")+'</div><div class="btns"><button class="btn" data-act="do-dist">تأكيد التوزيع</button><button class="btn ghost" data-act="close">إلغاء</button></div>');
}
function allocate(c){var al={},sum=0,ms=c.members.filter(function(x){return x.balance>0});ms.forEach(function(x,i){var v=i===ms.length-1?r2(c.undist-sum):r2(c.undist*x.balance/c.sumBal);al[x.m.id]=v;sum=r2(sum+v)});return al}
async function doDistribute(){var c=calc();var al=allocate(c);
  if(await w(function(){return db.collection("dists").add({date:today(),total:c.undist,alloc:al,by:S.email||null,createdAt:Date.now()})})){closeSheet();toast("وُزّعت الأرباح")}}
async function undoDist(id){if(await w(function(){return db.doc("dists/"+id).delete()}))toast("أُلغي آخر توزيع")}

function openNoteAdd(kind){
  if(!S.writable){toast("لديك صلاحية القراءة فقط");return}
  sheetState={kind:"note-add",nk:kind};
  var g=kind==="goal";
  openSheet('<h3>'+(g?"هدف ادخار":"ملاحظة أو خطة")+'</h3><form id="noteForm" class="stack"><div class="field"><label for="n-title">العنوان</label><input id="n-title" type="text"></div>'+
    (g?'<div class="grid2"><div class="field"><label for="n-target">المبلغ المستهدف</label><input id="n-target" type="text" inputmode="decimal" autocomplete="off" min="0"></div><div class="field"><label for="n-current">المحقق حتى الآن</label><input id="n-current" type="text" inputmode="decimal" autocomplete="off" min="0" value="0"></div></div><div class="field"><label for="n-member">لمن</label><select id="n-member"><option value="">للصندوق كله</option>'+sortedMembers().map(function(m){return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>'}).join("")+'</select></div>':'<div class="field"><label for="n-text">التفاصيل</label><textarea id="n-text"></textarea></div>')+
    '<div id="noteMsg"></div><div class="btns"><button type="submit" class="btn">حفظ</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>');
}
async function submitNote(ev){ev.preventDefault();var title=val("n-title").trim();if(!title){$("#noteMsg").innerHTML='<p class="err">اكتب عنواناً.</p>';return}
  var doc={kind:sheetState.nk,title:title,done:false,by:S.email||null,createdAt:Date.now()};
  if(sheetState.nk==="goal"){doc.target=r2(numv("n-target"));doc.current=r2(numv("n-current"));doc.member=val("n-member")}else doc.text=val("n-text").trim();
  if(await w(function(){return db.collection("notes").add(doc)})){closeSheet();toast("حُفظ")}}
function openNote(id){
  var n=S.notes.find(function(x){return x.id===id});if(!n)return;sheetState={kind:"note",id:id,confirm:false};
  var g=n.kind==="goal";
  var h='<h3>'+esc(n.title)+'</h3>'+(g?'<p class="small muted" style="margin:0">المستهدف '+money(n.target)+' ج.م'+(n.member?" · "+esc(nameOf(n.member)):"")+'</p>':'<p style="margin:0;white-space:pre-wrap">'+esc(n.text||"")+'</p>');
  if(S.writable){
    if(g)h+='<form id="goalForm" class="stack"><div class="field"><label for="g-current">المحقق حتى الآن</label><input id="g-current" type="text" inputmode="decimal" autocomplete="off" min="0" value="'+esc(n.current||0)+'"></div><button type="submit" class="btn block">تحديث التقدم</button></form>';
    else h+='<button class="btn block" data-act="toggle-note">'+(n.done?"إعادة فتحها":"تمّت")+'</button>';
    h+='<div class="btns"><button class="btn danger" data-act="del-note">حذف</button><button class="btn ghost" data-act="close">إغلاق</button></div>';
  }else h+='<button class="btn ghost block" data-act="close">إغلاق</button>';
  openSheet(h);
}
async function submitGoal(ev){ev.preventDefault();var cur=r2(numv("g-current")),id=sheetState.id,n=S.notes.find(function(x){return x.id===id});
  if(await w(function(){return db.doc("notes/"+id).update({current:cur,done:n&&n.target>0&&cur>=n.target})})){closeSheet();toast("حُدّث الهدف")}}
async function toggleNote(){var n=S.notes.find(function(x){return x.id===sheetState.id});if(!n)return;if(await w(function(){return db.doc("notes/"+n.id).update({done:!n.done})}))closeSheet()}
async function delNote(){if(!sheetState.confirm){sheetState.confirm=true;document.querySelector('[data-act="del-note"]').textContent="تأكيد الحذف";return}
  var id=sheetState.id;if(await w(function(){return db.doc("notes/"+id).delete()})){closeSheet();toast("حُذف")}}

/* ---------- plumbing ---------- */
function writeFailed(e){var c=e&&e.code;
  if(c==="permission-denied"){S.denied=true;S.denyWhat="write";render();window.scrollTo(0,0);toast("Firebase رفض الحفظ، انظر التنبيه أعلى الصفحة")}
  else if(c==="resource-exhausted")toast("تجاوزتم حد الاستخدام المجاني اليومي، حاولوا غداً");
  else toast("تعذر الحفظ: "+(c||"خطأ غير معروف"))}
async function w(fn){
  if(!db){toast("الصندوق غير متصل");return false}
  try{var p=Promise.resolve().then(fn);var res=await Promise.race([p.then(function(){return "ok"}),new Promise(function(r){setTimeout(function(){r("queued")},1500)})]);
    if(res==="ok"&&S.denied){S.denied=false;render()}
    if(res==="queued"){p.then(function(){if(S.denied){S.denied=false;render()}}).catch(writeFailed);if(!navigator.onLine)toast("حُفظ على الجهاز، وسيُرفع عند عودة الإنترنت")}return true}
  catch(e){writeFailed(e);return false}
}
var toastT;function toast(s){var t=$("#toast");t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-tab]");if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="close-scrim"){if(e.target===el)closeSheet();return}
  if(a==="close")return closeSheet();
  if(a==="add")return openAdd(el.dataset.type);
  if(a==="add-type"){sheetState.type=id;return openAdd(id)}
  if(a==="add-member")return openMember();
  if(a==="filter"){S.filter=id;return render()}
  if(a==="open-tx")return openTx(id);
  if(a==="del-tx")return delTx();
  if(a==="open-deal")return openDeal(id);
  if(a==="del-deal")return delDeal();
  if(a==="distribute")return openDistribute();
  if(a==="do-dist")return doDistribute();
  if(a==="undo-dist")return undoDist(id);
  if(a==="add-note")return openNoteAdd(el.dataset.type);
  if(a==="open-note")return openNote(id);
  if(a==="toggle-note")return toggleNote();
  if(a==="del-note")return delNote();
  if(a==="open-member")return openMemberSheet(id);
  if(a==="del-member")return delMember();
  if(a==="claim-admin"){if(S.settings&&S.settings.adminUid){toast("المدير محدد مسبقاً");return}w(function(){return db.doc("members/__settings").set({kind:"settings",adminUid:S.uid,adminEmail:S.email||"",createdAt:Date.now()})}).then(function(ok){if(ok)toast("أصبحت مدير الصندوق")});return}
  if(a==="retry"){S.denied=false;startData();render();toast("جارٍ إعادة الاتصال…");return}
  if(a==="seed-members"){var sb=$("#seedBtn");if(sb){sb.disabled=true;sb.textContent="جارٍ الإضافة…"}
    w(function(){return Promise.all(["إبراهيم","مريم","زينب"].map(function(n,i){return db.collection("members").add({name:n,order:i+1,createdAt:Date.now()})}))}).then(function(ok){if(ok)toast("أُضيف الأعضاء الثلاثة");else if(sb){sb.disabled=false;sb.textContent="إضافة إبراهيم ومريم وزينب"}});return}
  if(a==="logout"){closeSheet();stopData();signOut(AUTH);return}
  if(a==="reset-pass"){var em=val("l-email").trim();if(!em){showMsg($("#loginMsg"),'<p class="err">اكتب بريدك أولاً.</p>');return}sendPasswordResetEmail(AUTH,em).then(function(){toast("أُرسل رابط تغيير كلمة المرور إلى بريدك")}).catch(function(){toast("تعذر الإرسال، تحقق من البريد")});return}
});
document.addEventListener("submit",function(e){
  var id=e.target.id;
  if(id==="addForm")return submitAdd(e);
  if(id==="payForm")return submitPay(e);
  if(id==="memForm")return submitMember(e);
  if(id==="noteForm")return submitNote(e);
  if(id==="goalForm")return submitGoal(e);
  if(id==="loginForm"){e.preventDefault();var b=$("#loginBtn");b.disabled=true;b.textContent="جارٍ الدخول…";
    signInWithEmailAndPassword(AUTH,val("l-email").trim(),val("l-pass")).catch(function(er){var c=er&&er.code;b.disabled=false;b.textContent="دخول";
      showMsg($("#loginMsg"),'<p class="err">'+(c==="auth/network-request-failed"?"لا يوجد اتصال بالإنترنت.":c==="auth/too-many-requests"?"محاولات كثيرة، انتظر قليلاً ثم حاول.":"البريد أو كلمة المرور غير صحيحين.")+'</p>')});}
});
document.addEventListener("input",function(e){
  if(sheetState.kind==="add"){if(sheetState.ack){sheetState.ack=false;var b=$("#addSubmit");if(b)b.textContent="حفظ";var m=$("#addMsg");if(m)m.innerHTML=""}updateMPrev()}
  if(sheetState.kind==="deal")mudPreview();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
document.addEventListener("pointermove",chartHover);document.addEventListener("pointerdown",chartHover);document.addEventListener("pointerleave",chartLeave,true);

var AUTH=null,FS=null,UNSUBS=[];
function startData(){
  stopData();
  db={collection:function(name){var col=collection(FS,name);return {
      add:function(d){return addDoc(col,clean(d))},
      doc:function(id){return wrapRef(id?doc(FS,name,id):doc(col))},
      onSnapshot:function(next,err){return onSnapshot(col,function(sn){next({docs:sn.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})})},err)}}},
    doc:function(path){var p=path.split("/");return wrapRef(doc(FS,p[0],p[1]))}};
  COLS.forEach(function(name){
    UNSUBS.push(db.collection(name).onSnapshot(function(snap){var all=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      if(name==="members"){S.settings=all.find(function(x){return x.id==="__settings"})||null;all=all.filter(function(x){return x.id!=="__settings"})}
      S[name]=all;S.loaded[name]=true;render()},
      function(err){S.loaded[name]=true;render();if(err&&err.code==="permission-denied"){S.denied=true;S.denyWhat="read";render()}}));
  });
}
function stopData(){UNSUBS.forEach(function(u){try{u()}catch(e){}});UNSUBS=[];COLS.forEach(function(c){S[c]=[];S.loaded[c]=false})}
function wrapRef(ref){return {id:ref.id,set:function(d){return setDoc(ref,clean(d))},update:function(d){return updateDoc(ref,clean(d))},delete:function(){return deleteDoc(ref)}}}
function clean(d){return JSON.parse(JSON.stringify(d))}

render();
if(!firebaseConfig||!firebaseConfig.apiKey||/PUT_|ضع/.test(firebaseConfig.apiKey)){S.setup=true;render()}
else{
  var app=initializeApp(firebaseConfig);AUTH=getAuth(app);
  try{FS=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){FS=initializeFirestore(app,{})}
  onAuthStateChanged(AUTH,function(u){if(u){S.authed=true;S.writable=true;S.uid=u.uid;S.email=u.email;startData()}else{S.authed=false;S.email=null;stopData()}render()});
}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
